<style>/* ============================================================================
 * Campus · Mon programme — design « réponse d'abord »
 * Papier clair + encre, une carte « Maintenant » contrastée, frise de journée,
 * fil chronologique. Thème sombre automatique. Police système uniquement.
 * ========================================================================== */
:root {
  --bg: #f5f5f1; --surface: #ffffff; --surface-2: #efefe9; --surface-3: #e6e6df;
  --ink: #111318; --ink-2: #353a46; --muted: #6a6f7d; --faint: #9a9eaa; --line: #e2e2da;
  --hero: #111318; --hero-ink: #ffffff; --hero-muted: #a9adb8; --hero-2: #23262e; --lime: #c8f53c;
  --cm: #5551d8; --cm-soft: #ecebfd; --td: #b86e00; --td-soft: #fff0d4; --tp: #0d8a78; --tp-soft: #d9f3ee;
  --ex: #d3263a; --ex-soft: #fde5e7;
  --start: #2a5bd7; --start-soft: #e9f0ff; --end: #6a48c4; --end-soft: #f1ecfc; --free: #1b7d4b; --free-soft: #e3f5ea; --free-line: #8fd3ad;
  --warn: #8a5a00; --warn-soft: #fff4dd; --hol: #c25f0a; --hol-soft: #fff0e2;
  --r-lg: 22px; --r: 16px; --r-sm: 11px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --dock-h: 66px;
  color-scheme: light dark;
}
:root[data-theme="dark"] {
    --bg: #0d0e11; --surface: #17191e; --surface-2: #1f2228; --surface-3: #2a2e36;
    --ink: #f1f2f4; --ink-2: #d2d5dc; --muted: #9ba0ac; --faint: #6f7480; --line: #2a2d35;
    --hero: #1c1f26; --hero-2: #2a2e37;
    --cm: #a9a6ff; --cm-soft: rgba(124, 120, 255, .16); --td: #ffc35a; --td-soft: rgba(255, 180, 60, .14); --tp: #4fd8c1; --tp-soft: rgba(60, 210, 185, .14);
    --ex: #ff6b78; --ex-soft: rgba(255, 90, 105, .15);
    --start: #8cb0ff; --start-soft: rgba(90, 140, 255, .15); --end: #c3aaff; --end-soft: rgba(160, 120, 255, .15); --free: #6fe0a0; --free-soft: rgba(70, 200, 130, .13); --free-line: #2f7d53;
    --warn: #ffcf70; --warn-soft: rgba(255, 190, 80, .12); --hol: #ffab66; --hol-soft: rgba(255, 150, 70, .13);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e11; --surface: #17191e; --surface-2: #1f2228; --surface-3: #2a2e36;
    --ink: #f1f2f4; --ink-2: #d2d5dc; --muted: #9ba0ac; --faint: #6f7480; --line: #2a2d35;
    --hero: #1c1f26; --hero-2: #2a2e37;
    --cm: #a9a6ff; --cm-soft: rgba(124, 120, 255, .16); --td: #ffc35a; --td-soft: rgba(255, 180, 60, .14); --tp: #4fd8c1; --tp-soft: rgba(60, 210, 185, .14);
    --ex: #ff6b78; --ex-soft: rgba(255, 90, 105, .15);
    --start: #8cb0ff; --start-soft: rgba(90, 140, 255, .15); --end: #c3aaff; --end-soft: rgba(160, 120, 255, .15); --free: #6fe0a0; --free-soft: rgba(70, 200, 130, .13); --free-line: #2f7d53;
    --warn: #ffcf70; --warn-soft: rgba(255, 190, 80, .12); --hol: #ffab66; --hol-soft: rgba(255, 150, 70, .13);
    color-scheme: dark;
  }
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.45; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--start) 55%, transparent); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Cadre ---------- */
.app { min-height: 100vh; min-height: 100dvh; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
.bar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.5) blur(14px); -webkit-backdrop-filter: saturate(1.5) blur(14px); border-bottom: 1px solid transparent; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar-in { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.2px; text-decoration: none; }
.logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-style: normal; font-size: 15px; }
.logo small { font-weight: 600; color: var(--muted); }
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border-radius: 14px; margin-left: 8px; }
.tabs a { padding: 7px 14px; border-radius: 10px; font-weight: 650; font-size: 14.5px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 7px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.ctrl .arrowbtn { display: none; }
.ctrl { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 14px; font-weight: 650; font-size: 14.5px; min-height: 40px; text-decoration: none; }
.btn:hover { border-color: var(--faint); }
.btn.round { width: 40px; padding: 0; border-radius: 50%; }
.btn.ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.lime { background: var(--lime); color: #111318; border-color: var(--lime); }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: .45; }
.pick { position: relative; overflow: hidden; }
.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
.pick input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* ---------- En-tête de page ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 22px 0 14px; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.kicker b { color: var(--ink); }
.h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.8px; }
.h1 em { font-style: normal; color: var(--faint); font-weight: 700; }
.h1-pick { position: relative; display: inline-block; }
.h1-pick input { display: none; }

/* Bande de la semaine : histogramme de charge */
.week { display: grid; grid-template-columns: 40px repeat(7, 1fr) 40px; gap: 6px; align-items: stretch; padding-bottom: 16px; }
.week .arrow { border: 0; background: transparent; color: var(--muted); border-radius: 12px; display: grid; place-items: center; }
.week .arrow:hover { background: var(--surface-2); color: var(--ink); }
.day { border: 0; background: var(--surface); border-radius: 16px; padding: 9px 4px 8px; display: grid; grid-template-rows: auto auto 30px; justify-items: center; gap: 1px; position: relative; }
.day .dn { font-size: 12px; font-weight: 700; color: var(--faint); letter-spacing: .4px; }
.day .dd { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
.day .load { width: 100%; display: flex; align-items: flex-end; justify-content: center; height: 30px; padding-top: 4px; }
.day .load i { width: 46%; max-width: 30px; border-radius: 5px 5px 2px 2px; background: var(--ink); opacity: .85; min-height: 3px; }
.day .load i.hol { background: repeating-linear-gradient(135deg, var(--hol) 0 3px, transparent 3px 6px); opacity: 1; height: 100% !important; }
.day .load i.prep { background: repeating-linear-gradient(135deg, var(--faint) 0 3px, transparent 3px 6px); opacity: 1; height: 100% !important; }
.day .load i.none { background: var(--line); opacity: 1; height: 3px !important; }
.day .load i.exam { background: var(--ex); opacity: 1; }
.day[aria-current="true"] .load i.exam { background: #ff5d6c; }
.day.today .dd { color: var(--start); }
.day.today::after { content: ""; position: absolute; bottom: -6px; left: 50%; width: 18px; height: 3px; margin-left: -9px; border-radius: 3px; background: var(--start); }
.day[aria-current="true"] { background: var(--ink); color: var(--bg); }
.day[aria-current="true"] .dn { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.day[aria-current="true"] .dd { color: var(--bg); }
.day[aria-current="true"] .load i { background: var(--lime); opacity: 1; }
.day[aria-current="true"] .load i.none { background: color-mix(in srgb, var(--bg) 30%, transparent); }
.day.off:not([aria-current="true"]) { background: transparent; }
.day.off:not([aria-current="true"]) .dd { color: var(--faint); }

/* ---------- Mise en page ---------- */
.page { padding-bottom: 48px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; }
.panel-t { margin: 0 0 12px; font-size: 13px; font-weight: 750; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Carte « Maintenant » */
.now { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-lg); padding: 20px 22px 22px; position: relative; overflow: hidden; }
.now .tag-now { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; letter-spacing: .7px; text-transform: uppercase; color: var(--lime); }
.now .tag-now .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(200, 245, 60, .6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(200, 245, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(200, 245, 60, 0); } }
@media (prefers-reduced-motion: reduce) { .now .tag-now .pulse { animation: none; } }
.now .big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.now .big b { font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; }
.now .big span { font-size: 16px; color: var(--hero-muted); font-weight: 650; }
.now h2 { margin: 12px 0 0; font-size: 21px; line-height: 1.25; font-weight: 750; letter-spacing: -.2px; }
.now .where { display: inline-flex; align-items: center; gap: 9px; margin-top: 14px; padding: 10px 14px; border-radius: 13px; background: var(--hero-2); font-weight: 750; font-size: 17px; }
.now .where.unknown { color: #ffd38a; }
.now .meta { margin-top: 10px; font-size: 14px; color: var(--hero-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.now .bar-p { height: 6px; border-radius: 6px; background: var(--hero-2); margin-top: 16px; overflow: hidden; }
.now .bar-p i { display: block; height: 100%; background: var(--lime); border-radius: 6px; }
.now .then { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hero-2); font-size: 14.5px; color: var(--hero-muted); }
.now .then b { color: var(--hero-ink); }
.now .go { margin-top: 14px; background: none; border: 0; color: var(--lime); font-weight: 750; padding: 0; font-size: 14.5px; }
.now .empty { margin-top: 10px; color: var(--hero-muted); font-size: 16px; }
.now .tag { background: var(--hero-2); color: var(--hero-ink); }
.now .tag.ex { background: #ff5d6c; color: #fff; }

/* Étiquettes de type */
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .3px; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.tag.cm { background: var(--cm-soft); color: var(--cm); } .tag.td { background: var(--td-soft); color: var(--td); }
.tag.tp { background: var(--tp-soft); color: var(--tp); } .tag.ex { background: var(--ex-soft); color: var(--ex); }
.tag.live { background: var(--lime); color: #111318; }

/* Frise de la journée */
.rail { position: relative; height: 34px; border-radius: 10px; background: var(--surface-2); margin: 4px 0 6px; }
.rail .seg { position: absolute; top: 0; bottom: 0; border-radius: 9px; background: var(--ink); }
.rail .gap { font-style: normal; position: absolute; top: 5px; bottom: 5px; border-radius: 6px; background: repeating-linear-gradient(135deg, var(--free-soft) 0 5px, color-mix(in srgb, var(--free) 22%, transparent) 5px 7px); display: grid; place-items: center; color: var(--free); font-size: 12px; font-weight: 800; overflow: hidden; white-space: nowrap; }
.rail .seg.past { opacity: .35; }
.rail .nowm { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 3px; background: var(--start); box-shadow: 0 0 0 2px var(--surface); }
.rail-l { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 750; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface-2); border-radius: 13px; padding: 10px 12px; }
.stat small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 650; }
.stat b { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
.stat.free b { color: var(--free); }

/* Fil chronologique */
.thread { list-style: none; margin: 0; padding: 0; position: relative; }
.t-item { display: grid; grid-template-columns: 64px 22px minmax(0, 1fr); gap: 0 10px; position: relative; }
.t-time { padding-top: 14px; text-align: right; }
.t-time b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; }
.t-time span { font-size: 14.5px; color: var(--muted); font-weight: 650; }
.t-axis { position: relative; display: flex; justify-content: center; }
.t-axis::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--surface-3); border-radius: 3px; }
.t-item.first .t-axis::before { top: 20px; } .t-item.last .t-axis::before { bottom: calc(100% - 22px); }
.t-axis i { position: relative; margin-top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--cm); }
.t-item.td .t-axis i { border-color: var(--td); } .t-item.tp .t-axis i { border-color: var(--tp); } .t-item.ex .t-axis i { border-color: var(--ex); }
.t-item.live .t-axis i { background: var(--lime); border-color: var(--ink); }
.t-card { background: var(--surface); border-radius: var(--r); padding: 14px 16px; margin: 6px 0; min-width: 0; }
.t-item.ex .t-card { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ex) 45%, transparent); }
.t-item.live .t-card { box-shadow: inset 0 0 0 2px var(--ink); }
.t-item.past { opacity: .5; }
.t-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.t-dur { font-size: 13px; color: var(--faint); font-weight: 650; }
.t-card h3 { margin: 6px 0 0; font-size: 18px; line-height: 1.28; font-weight: 750; letter-spacing: -.2px; overflow-wrap: anywhere; }
.t-card .sub { font-size: 13.5px; color: var(--faint); margin-top: 1px; }
.t-place { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 16.5px; font-weight: 780; color: var(--ink); }
.t-place.online { color: var(--tp); } .t-place.unknown { color: var(--warn); font-weight: 700; font-size: 15px; }
.t-prof { font-size: 14px; color: var(--muted); margin-top: 3px; }
.t-prof .nat { color: var(--ex); font-weight: 700; }
.t-break, .t-gap { display: grid; grid-template-columns: 64px 22px minmax(0, 1fr); gap: 0 10px; }
.t-break .t-axis::before { background: var(--surface-3); }
.t-break p { margin: 0; padding: 2px 0; font-size: 12.5px; color: var(--faint); font-weight: 650; }
.t-gap .t-axis::before { background: repeating-linear-gradient(180deg, var(--free-line) 0 5px, transparent 5px 10px); width: 3px; }
.t-gap .pill { margin: 10px 0; display: inline-flex; align-items: center; gap: 8px; align-self: center; padding: 9px 14px; border-radius: 999px; background: var(--free-soft); color: var(--free); font-weight: 780; font-size: 15px; }
.t-gap .pill small { font-weight: 650; font-size: 13.5px; opacity: .85; }
.t-gap .pill .nw { background: var(--free); color: var(--surface); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; letter-spacing: .3px; text-transform: uppercase; }

/* Résumé coloré */
.recap { display: flex; flex-direction: column; gap: 8px; }
.recap p { margin: 0; padding: 12px 14px; border-radius: 13px; font-weight: 750; font-size: 16.5px; display: flex; align-items: center; gap: 10px; }
.recap p::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; background: currentColor; opacity: .75; }
.recap .start { background: var(--start-soft); color: var(--start); }
.recap .end { background: var(--end-soft); color: var(--end); }
.recap .free { background: var(--free-soft); color: var(--free); }

/* États de journée */
.state { background: var(--surface); border-radius: var(--r-lg); padding: 26px 22px; display: flex; gap: 16px; align-items: flex-start; }
.state .ico { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.state .ico svg { width: 24px; height: 24px; }
.state h2 { margin: 2px 0 6px; font-size: 21px; line-height: 1.25; font-weight: 800; letter-spacing: -.3px; }
.state p { margin: 0; color: var(--muted); }
.state.ferie .ico, .state.vacances .ico { background: var(--hol-soft); color: var(--hol); }
.state.examens .ico { background: var(--ex-soft); color: var(--ex); }
.state.evenement .ico { background: var(--end-soft); color: var(--end); }
.state.libre .ico, .state.dimanche .ico { background: var(--free-soft); color: var(--free); }
.state.non-renseigne .ico, .state.hors .ico { background: var(--warn-soft); color: var(--warn); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; background: var(--warn-soft); color: var(--warn); font-size: 14.5px; font-weight: 600; }
.note.info { background: var(--start-soft); color: var(--start); }

/* Petite liste « À venir » */
.up { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.up li + li { border-top: 1px solid var(--line); }
.up button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; }
.up .w { font-size: 13px; font-weight: 750; color: var(--muted); }
.up .w b { display: block; color: var(--ink); font-size: 15px; }
.up .n { font-weight: 700; font-size: 15px; line-height: 1.3; }
.up .p { font-size: 13.5px; color: var(--muted); }

/* ---------- Semaine ---------- */
.wsum { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 0 0 18px; font-size: 15px; color: var(--muted); }
.wsum b { color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin-right: 5px; }
.wsum .free b { color: var(--free); } .wsum .ex b { color: var(--ex); }
/* Grille horaire (ordinateur) */
.grid { --hh: 54px; display: grid; grid-template-columns: 52px repeat(var(--n), minmax(0, 1fr)); background: var(--surface); border-radius: var(--r-lg); padding: 14px 14px 18px 6px; }
.g-h { padding: 4px 6px 12px; text-align: center; border: 0; background: none; }
.g-h b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
.g-h span { font-size: 12px; font-weight: 750; color: var(--faint); text-transform: uppercase; letter-spacing: .4px; }
.g-h small { display: block; font-size: 12px; color: var(--muted); font-weight: 650; }
.g-h.today b { color: var(--start); }
.g-hours { position: relative; }
.g-hours span { position: absolute; right: 8px; font-size: 11.5px; color: var(--faint); font-weight: 650; transform: translateY(-50%); }
.g-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(180deg, var(--line) 0 1px, transparent 1px var(--hh)); }

<script>/* ---- xlsx.js ---- */
/* ============================================================================
 * Campus · Mon programme — Lecteur .xlsx minimal (sans dépendance)
 * ----------------------------------------------------------------------------
 * Un fichier .xlsx est une archive ZIP contenant du XML. Ce module :
 *   1. lit l'annuaire central du ZIP ;
 *   2. décompresse les entrées utiles (deflate-raw) ;
 *   3. extrait la feuille : valeurs, cellules fusionnées, couleur de fond.
 * Fonctionne dans le navigateur (DecompressionStream) et sous Node (zlib).
 * ========================================================================== */
(function (root) {
  'use strict';

  /* ---------- ZIP ---------- */
  function readZipDirectory(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) valide.");
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder('utf-8');
    const entries = {};
    for (let k = 0; k < count; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Archive du classeur corrompue.');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lho + 26, true);
      const lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      entries[name] = { method, data: u8.subarray(start, start + csize) };
      p += 46 + nlen + elen + clen;
    }
    return entries;
  }

  async function browserInflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error("Ce navigateur ne sait pas lire les classeurs. Mets-le à jour ou utilise Chrome, Edge, Safari ou Firefox récents.");
    }
    const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /* ---------- XML utilitaires ---------- */
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function decodeXml(s) {
    return s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, (m, e) => {
      if (e[0] === '#') {
        const code = e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        return String.fromCodePoint(code);
      }
      return ENT[e.toLowerCase()] || m;
    });
  }
  function attr(attrs, name) {
    const m = new RegExp('(?:^|\\s)' + name + '="([^"]*)"').exec(attrs);
    return m ? decodeXml(m[1]) : null;
  }
  function textRuns(xml) {
    let out = '';
    const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t(?:\s[^>]*)?\/>/g;
    let m;
    while ((m = re.exec(xml))) out += m[1] ? decodeXml(m[1]) : '';
    return out;
  }

  /* ---------- Référence de cellule ---------- */
  function colToNum(letters) {
    let n = 0;
    for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n;
  }
  function numToCol(n) {
    let s = '';
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }
  function parseRef(ref) {
    const m = /^([A-Z]+)(\d+)$/i.exec(ref);
    return m ? { c: colToNum(m[1]), r: parseInt(m[2], 10) } : null;
  }

  /* ---------- Lecture du classeur ---------- */
  async function readWorkbook(u8, inflateRaw, preferredSheet) {
    const entries = readZipDirectory(u8);
    const inflate = inflateRaw || browserInflateRaw;
    const dec = new TextDecoder('utf-8');
    async function text(name) {
      const e = entries[name];
      if (!e) return null;
      const data = e.method === 0 ? e.data : await inflate(e.data);
      return dec.decode(data);
    }

    const wbXml = await text('xl/workbook.xml');
    if (!wbXml) throw new Error("Classeur illisible : feuille de calcul introuvable.");
    const relsXml = (await text('xl/_rels/workbook.xml.rels')) || '';
    const rels = {};
    relsXml.replace(/<Relationship\b([^>]*)\/?>/g, (m, a) => { rels[attr(a, 'Id')] = attr(a, 'Target'); return m; });

    const sheets = [];
    wbXml.replace(/<sheet\b([^>]*)\/?>/g, (m, a) => {
      sheets.push({ name: attr(a, 'name'), rid: attr(a, 'r:id') });
      return m;
    });
    if (!sheets.length) throw new Error('Aucune feuille dans le classeur.');
    const re = preferredSheet || /EDT|emploi|planning/i;
    const sheet = sheets.find((s) => re.test(s.name)) || sheets[0];
    let target = rels[sheet.rid] || 'worksheets/sheet1.xml';
    target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
    const sheetXml = await text('xl/' + target);
    if (!sheetXml) throw new Error('Feuille « ' + sheet.name + ' » introuvable dans le classeur.');

    // Chaînes partagées
    const shared = [];
    const ssXml = await text('xl/sharedStrings.xml');
    if (ssXml) {
      const re2 = /<si>([\s\S]*?)<\/si>/g;
      let m;
      while ((m = re2.exec(ssXml))) shared.push(textRuns(m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, '')));
    }

    // Styles → couleur de remplissage (RGB explicite uniquement)
    const xfFill = [];
    const fills = [];
    const stXml = await text('xl/styles.xml');
    if (stXml) {
      const fm = /<fills\b[^>]*>([\s\S]*?)<\/fills>/.exec(stXml);
      if (fm) {
        const re3 = /<fill>([\s\S]*?)<\/fill>|<fill\/>/g;
        let m;
        while ((m = re3.exec(fm[1]))) {
          const body = m[1] || '';
          const solid = /patternType="solid"/.test(body);
          const fg = /<fgColor\b([^>]*)\/?>/.exec(body);
          fills.push(solid && fg ? attr(fg[1], 'rgb') : null);
        }
      }
      const xm = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(stXml);
      if (xm) xm[1].replace(/<xf\b([^>]*)\/?>/g, (m, a) => { xfFill.push(parseInt(attr(a, 'fillId') || '0', 10)); return m; });
    }

    // Cellules
    const cells = new Map(); // "r,c" -> { r, c, v, fill }
    let maxR = 0, maxC = 0;
    const reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let m;
    while ((m = reC.exec(sheetXml))) {
      const a = m[1];
      const ref = parseRef(attr(a, 'r') || '');
      if (!ref) continue;
      const t = attr(a, 't');
      const s = parseInt(attr(a, 's') || '0', 10);
      const body = m[2] || '';
      let v = null;
      if (t === 'inlineStr') v = textRuns(body);
      else {
        const vm = /<v>([\s\S]*?)<\/v>/.exec(body);
        if (vm) v = t === 's' ? shared[parseInt(vm[1], 10)] : decodeXml(vm[1]);
      }
      const fill = fills[xfFill[s]] || null;
      if (v !== null && String(v).trim() === '') v = null;
      cells.set(ref.r + ',' + ref.c, { r: ref.r, c: ref.c, v, fill });
      if (v !== null) { maxR = Math.max(maxR, ref.r); maxC = Math.max(maxC, ref.c); }
    }

    // Fusions
    const merges = [];
    sheetXml.replace(/<mergeCell\b([^>]*)\/?>/g, (mm, a) => {
      const parts = (attr(a, 'ref') || '').split(':');
      const p1 = parseRef(parts[0]), p2 = parseRef(parts[1] || parts[0]);
      if (p1 && p2) merges.push({ r1: p1.r, c1: p1.c, r2: p2.r, c2: p2.c });
      return mm;
    });

    // Date de dernière modification du classeur (propriétés du document)
    let modified = null;
    const core = await text('docProps/core.xml');
    if (core) { const mm = /<dcterms:modified\b[^>]*>([^<]+)<\/dcterms:modified>/.exec(core); if (mm) modified = mm[1].trim(); }

    return { sheetName: sheet.name, cells, merges, maxR, maxC, modified };
  }

  const api = { readWorkbook, readZipDirectory, colToNum, numToCol, parseRef };
  root.CampusXlsx = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ============================================================================
 * Campus · Mon programme — Interprétation de la feuille EDT
 * ----------------------------------------------------------------------------
 * Entrée : la feuille lue par CampusXlsx (cellules, fusions, couleurs).
 * Sortie : un jeu de données neutre (toutes les séances, tous les groupes) :
 *   { meta, weeks[], slots{}, sessions[], events[], warnings[] }
 * Le filtrage par groupe se fait ensuite dans l'application (schedule.js),
 * ce qui permet de changer de groupe sans relire le classeur.
 * ========================================================================== */
(function (root) {
  'use strict';
  const X = root.CampusXlsx || (typeof require !== 'undefined' ? require('./xlsx.js') : null);

  const DAY_NAMES = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const MONTHS = { jan: 1, fev: 2, feb: 2, mar: 3, avr: 4, apr: 4, mai: 5, may: 5, juin: 6, jun: 6,
    juil: 7, jul: 7, aou: 8, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

  const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const clean = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

  function monthOf(word) {
    const w = norm(word).replace(/\./g, '');
    if (w.startsWith('juil')) return 7;
    if (w.startsWith('juin')) return 6;
    for (const k of Object.keys(MONTHS)) if (w.startsWith(k)) return MONTHS[k];
    return null;
  }
  function addDaysISO(d, n) {
    const [y, m, dd] = d.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, dd + n));
    return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }
  function dowISO(d) { // 0 = lundi … 6 = dimanche
    const [y, m, dd] = d.split('-').map(Number);
    return (new Date(Date.UTC(y, m - 1, dd)).getUTCDay() + 6) % 7;
  }

  /* « 07-12 Sept 2026 », « 28 Sep - 03 Oct 2026 », « 30 Nov - 05 Déc 2026 » */
  const W = '([A-Za-zÀ-ÿ.]+)';
  const RE_RANGE_1 = new RegExp('^(\\d{1,2})\\s*[-–]\\s*(\\d{1,2})\\s+' + W + '\\s+(\\d{4})$');
  const RE_RANGE_2 = new RegExp('^(\\d{1,2})\\s+' + W + '(?:\\s+(\\d{4}))?\\s*[-–]\\s*(\\d{1,2})\\s+' + W + '\\s+(\\d{4})$');
  function parseWeekLabel(label) {
    const s = clean(label);
    let m = RE_RANGE_1.exec(s);
    if (m) {
      const mo = monthOf(m[3]); if (!mo) return null;
      const y = +m[4];
      let endM = mo, endY = y;
      if (+m[2] < +m[1]) { endM = mo === 12 ? 1 : mo + 1; if (mo === 12) endY++; }
      return { start: iso(y, mo, +m[1]), end: iso(endY, endM, +m[2]) };
    }
    m = RE_RANGE_2.exec(s);
    if (m) {
      const m1 = monthOf(m[2]), m2 = monthOf(m[5]); if (!m1 || !m2) return null;
      const y2 = +m[6];
      const y1 = m[3] ? +m[3] : (m1 > m2 ? y2 - 1 : y2);
      return { start: iso(y1, m1, +m[1]), end: iso(y2, m2, +m[4]) };
    }
    return null;
  }

  /* « 08H30-10H20 » → { start:'08:30', end:'10:20' } */
  function parseSlot(text) {
    const m = /(\d{1,2})\s*[hH:]\s*(\d{2})?\s*[-–à]+\s*(\d{1,2})\s*[hH:]\s*(\d{2})?/.exec(String(text || ''));
    if (!m) return null;
    return { start: pad(+m[1]) + ':' + (m[2] || '00'), end: pad(+m[3]) + ':' + (m[4] || '00') };
  }

  /* Rouge franc = examen (R élevé, V et B faibles). Le rose saumon des cours n'est pas concerné. */
  function isRedFill(rgb) {
    if (!rgb || rgb.length < 6) return false;
    const h = rgb.slice(-6);
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return r >= 200 && g <= 80 && b <= 80;
  }

  /* ---------- Analyse du texte d'une cellule ---------- */
  const RE_KIND = /^(CM|CC|CF|DS|TD|TP)([A-H])?(?=\s|$|[:\-–])\s*[:\-–]?\s*(.*)$/i;
  const RE_ONLINE = /(^|[\s(])(?:[àa]\s+distance|en\s+ligne|distanciel|online|visio(?:conf[ée]rence)?)(?=$|[\s.,;)])/gi;
  const RE_ROOM = /\bsalles?\s*:?\s*(.+)$/i;
  const RE_PROF = /\b(?:Prof(?:esseur)?|Pr|Mme)\.?\s+([A-ZÀ-Ý][A-ZÀ-Ý'’\-]+(?:\s+[A-ZÀ-Ý][A-ZÀ-Ý'’\-]+)*)(?=\s|$|[,;.])/;

  function parseRoom(raw) {
    let s = clean(raw).replace(/[.;,]+$/, '');
    if (!s) return { room: null, building: null };
    s = s.replace(/\bamphi\s*(\d+)/i, 'Amphi $1');
    const parts = s.split('/').map(clean).filter(Boolean);
    let room = parts[0] || null, building = parts[1] || null;
    if (building) building = building.replace(/^b[aâ]t(?:iment)?\.?\s*/i, 'Bât ');
    return { room, building };
  }

  function parseCellText(text) {
    const t = clean(text);
    const m = RE_KIND.exec(t);
    if (!m) return null;
    const code = m[1].toUpperCase();
    const group = m[2] ? m[2].toUpperCase() : null;
    let rest = m[3] || '';
    let room = null, building = null;
    const rm = RE_ROOM.exec(rest);
    if (rm) { ({ room, building } = parseRoom(rm[1])); rest = rest.slice(0, rm.index); }
    let online = false;
    RE_ONLINE.lastIndex = 0;
    if (RE_ONLINE.test(rest)) { online = true; rest = rest.replace(RE_ONLINE, '$1 '); }
    RE_ONLINE.lastIndex = 0;
    let prof = null;
    const pm = RE_PROF.exec(rest);
    if (pm) { prof = pm[1]; rest = rest.slice(0, pm.index) + ' ' + rest.slice(pm.index + pm[0].length); }
    let subject = clean(rest).replace(/[\s:;,\-–]+$/, '');
    let short = subject, long = null;
    const par = /^(.{1,24}?)\s*\((.+)\)$/.exec(subject);
    if (par) { short = par[1].trim(); long = par[2].trim(); }
    let kind = code;
    if (code === 'CC' || code === 'CF' || code === 'DS') kind = 'EXAM';
    return { code, kind, group: kind === 'TD' || kind === 'TP' ? group : null, subject, short, long, prof, room, building, online };
  }

  function classifyEvent(text) {
    const n = norm(text);
    if (/vacance|conge/.test(n)) return 'vacation';
    if (/fete|ferie|aid\b|\baid|nouvel an|achoura|mawlid|independance|marche verte|trone/.test(n)) return 'holiday';
    if (/preparation|revision/.test(n)) return 'prep';
    if (/examen|exam|rattrapage|partiel/.test(n)) return 'exams';
    return 'event';
  }

  /* ---------- Interprétation de la feuille ---------- */
  function interpret(sheet, sourceName) {
    const { cells, merges } = sheet;
    const warnings = [];
    const get = (r, c) => { const x = cells.get(r + ',' + c); return x && x.v != null ? String(x.v) : null; };

    // Fusions : cellule d'ancrage et cellules couvertes
    const mergeAt = new Map(); const covered = new Set();

      h += '<button type="button" class="day' + (d === today() ? ' today' : '') + (info.status !== 'cours' ? ' off' : '') + '" data-date="' + d + '"' + (d === date ? ' aria-current="true"' : '') + ' aria-label="' + esc(label) + '">' +
        '<span class="dn">' + S.JOURS_COURTS[i] + '</span><span class="dd">' + +d.slice(8) + '</span><span class="load">' + bar + '</span></button>';
    }
    return h + '<button type="button" class="arrow" data-act="next" aria-label="' + (isWeek ? 'Semaine suivante' : 'Jour suivant') + '">' + icon('right') + '</button></nav>';
  }

  function headHTML() {
    if (state.view === 'data') return '<div class="head"><div><div class="kicker">Planning</div><h1 class="h1">Données</h1></div></div>';
    const d = state.date, isWeek = state.view === 'week';
    const w = S.weekOf(state.data, d);
    const monday = S.mondayOf(d), sunday = S.addDays(monday, 6);
    let kicker, title;
    if (isWeek) {
      kicker = (w ? 'Semaine <b>' + w.n + '</b>' : 'Hors planning') + (today() >= monday && today() <= sunday ? ' · cette semaine' : '');
      const A = monday.split('-'), B = sunday.split('-');
      title = A[1] === B[1] ? (+A[2]) + '–' + (+B[2]) + ' ' + S.MOIS[+A[1] - 1] : S.fmtDayMonth(monday) + ' – ' + S.fmtDayMonth(sunday);
    } else {
      const r = S.relativeDay(d, today());
      kicker = (r === "Aujourd'hui" || r === 'Demain' || r === 'Hier' ? '<b>' + r + '</b> · ' : '') + (w ? 'Semaine ' + w.n : 'Hors planning');
      const p = d.split('-');
      title = S.cap(S.JOURS[S.dow(d)]) + ' ' + (+p[2] === 1 ? '1er' : +p[2]) + ' <em>' + S.MOIS[+p[1] - 1] + '</em>';
    }
    return '<div class="head"><div><div class="kicker">' + kicker + '</div><label class="h1-pick"><h1 class="h1">' + title +
      '<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></h1><input type="date" data-act="pick" value="' + d + '" aria-label="Choisir une date"></label></div></div>' + weekStripHTML(d);
  }

  /* ---------- Vues ---------- */
  function viewDay() {
    const d = state.date, isToday = d === today();
    const info = S.dayInfo(state.data, d, state.groups);
    let main = '', side = '';
    if (isToday || info.status !== 'cours') main += isToday ? nowHTML('order-1') : '';
    if (info.status !== 'cours') {
      main += stateHTML(info, isToday ? '' : 'order-1');
      side += upcomingHTML(d);
    } else {
      if (info.event) main += '<div class="note info">' + icon('star') + '<span>' + esc(info.event.label) + (info.event.start ? ' · ' + S.fmtTime(info.event.start) + '–' + S.fmtTime(info.event.end) : '') + '</span></div>';
      if (info.summary.conflicts) main += '<div class="note">' + icon('alert') + '<span>Deux séances se chevauchent : vérifie le classeur.</span></div>';
      main += threadHTML(info, isToday) + recapHTML(info.summary);
      side += dayPanelHTML(info, isToday) + upcomingHTML(d);
    }
    return '<div class="cols"><div class="col main">' + main + '</div><aside class="col side">' + side + '</aside></div>';
  }

  function viewWeek() {
    const monday = S.mondayOf(state.date);
    const ws = S.weekSummary(state.data, monday, state.groups);
    let h = '<div class="wsum"><span><b>' + ws.count + '</b>séance' + (ws.count > 1 ? 's' : '') + '</span><span><b>' + (ws.courseMinutes ? S.fmtDuration(ws.courseMinutes) : '0') + '</b>de cours</span>' +
      '<span class="free"><b>' + (ws.freeMinutes ? S.fmtDuration(ws.freeMinutes) : '0') + '</b>d’heures creuses</span>' + (ws.exams ? '<span class="ex"><b>' + ws.exams + '</b>examen' + (ws.exams > 1 ? 's' : '') + '</span>' : '') + '</div>';
    // Grille horaire (ordinateur)
    const days = ws.days.filter((x, i) => i < 6 || x.status === 'cours');
    let lo = 8 * 60, hi = 18 * 60 + 30;
    days.forEach((x) => { if (x.summary.startMin != null) { lo = Math.min(lo, Math.floor(x.summary.startMin / 60) * 60); hi = Math.max(hi, x.summary.endMin); } });
    const HH = 54, px = (m) => ((m - lo) / 60) * HH, height = px(hi) + 6;
    h += '<div class="grid" style="--n:' + days.length + '"><div></div>';
    days.forEach((x) => {
      const isT = x.date === today();
      h += '<button type="button" class="g-h' + (isT ? ' today' : '') + '" data-go="' + hashFor('day', x.date) + '"><span>' + S.JOURS_COURTS[S.dow(x.date)] + '</span><b>' + +x.date.slice(8) + '</b><small>' + (x.status === 'cours' ? S.fmtDuration(x.summary.courseMinutes) : '—') + '</small></button>';
    });
    h += '<div class="g-hours" style="height:' + height + 'px">';
    for (let m = lo; m <= hi; m += 60) h += '<span style="top:' + px(m) + 'px">' + S.fmtMinTime(m) + '</span>';
    h += '</div>';
    days.forEach((x) => {
      const isT = x.date === today();
      h += '<div class="g-col' + (isT ? ' today' : '') + '" style="height:' + height + 'px">';
      if (x.status === 'cours') {
        x.sessions.filter((s) => s.start).forEach((s) => {
          const top = px(S.toMin(s.start)), hgt = px(S.toMin(s.end)) - top - 3, p = S.placeOf(s);
          h += '<button type="button" class="g-ev ' + TYPE(s) + '" style="top:' + top.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px" data-go="' + hashFor('day', x.date) + '" title="' + esc(S.titleOf(s) + ' · ' + placeText(s)) + '">' +
            '<span class="gt">' + S.fmtTime(s.start) + ' · ' + esc(s.exam ? s.code : S.badgeOf(s).label) + '</span><b>' + esc(s.exam ? 'Examen · ' + S.shortName(s) : S.shortName(s)) + '</b><span class="gp' + (p.kind === 'unknown' ? ' unk' : '') + '">' + esc(p.kind === 'unknown' ? 'Salle ?' : p.text) + '</span></button>';
        });
        if (isT && state.now.minutes >= lo && state.now.minutes <= hi) h += '<i class="g-now" style="top:' + px(state.now.minutes) + 'px"></i>';
      } else if (x.status !== 'libre' && x.status !== 'dimanche') {
        const st = STATE_TEXT[x.status];
        h += '<div class="g-full ' + x.status + '">' + esc(st ? st.t(x) : '') + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    // Agenda (téléphone)
    h += '<div class="agenda">';
    ws.days.forEach((x, i) => {
      const isT = x.date === today(), sum = x.summary;
      h += '<button type="button" class="ag' + (isT ? ' today' : '') + '" data-go="' + hashFor('day', x.date) + '"><div class="ag-d"><span>' + S.JOURS_COURTS[i] + '</span><b>' + +x.date.slice(8) + '</b></div><div>';
      if (x.status === 'cours') {
        h += '<div class="ag-h"><b>' + sum.start + ' → ' + sum.end + '</b> · ' + sum.count + ' séance' + (sum.count > 1 ? 's' : '') + (sum.freeMinutes ? ' · ' + S.fmtDuration(sum.freeMinutes) + ' libre' : '') + '</div>' + railHTML(sum, isT, true) + '<ul>';
        x.sessions.forEach((s) => {
          const p = S.placeOf(s);
          h += '<li><time>' + S.fmtTime(s.start) + '</time><div><div class="n">' + esc(S.titleOf(s)) + '</div><div class="p">' + tagHTML(s) + '<span class="' + (p.kind === 'unknown' ? 'unk' : '') + '">' + esc(placeText(s)) + '</span></div></div></li>';
        });
        h += '</ul>';
      } else {
        const st = STATE_TEXT[x.status];
        h += '<div class="ag-off ' + x.status + '">' + esc(st ? st.t(x) : '') + '</div>';
      }
      h += '</div></button>';
    });
    return h + '</div>';
  }

  function fmtStamp(isoStr) {
    if (!isoStr) return 'non indiquée';
    const dt = new Date(isoStr); if (isNaN(dt)) return esc(isoStr);
    const z = S.nowInZone(dt);
    return S.fmtDateShort(z.date) + ' ' + z.date.slice(0, 4) + ' à ' + S.fmtMinTime(z.minutes);
  }

  function viewData() {
    const d = state.data;
    const mine = d.sessions.filter((s) => S.isMine(s, state.groups));
    const gi = S.groupsInData(d);
    const opt = (list, v) => (list.length ? list : [v]).map((x) => '<option' + (x === v ? ' selected' : '') + '>' + x + '</option>').join('');
    const unknown = mine.filter((s) => s.date >= today() && S.placeOf(s).kind === 'unknown');
    let left = '<section class="panel"><h2 class="panel-t">Mettre à jour le planning</h2>';
    if (!state.pending) {
      left += '<div class="drop" id="drop"><p class="big">' + icon('upload') + 'Nouveau classeur EDT_ING5_CYB</p><p>Dépose le fichier .xlsx ici ou choisis-le. Il est lu sur cet appareil, rien n’est envoyé.</p>' +
        '<label class="btn ink">' + icon('upload') + 'Choisir le fichier<input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" data-act="file" class="sr"></label></div>';
    } else {
      const p = state.pending, nd = p.data, nm = nd.sessions.filter((s) => S.isMine(s, state.groups));
      left += '<div class="note info">' + icon('check') + '<span><b>' + esc(p.name) + '</b> lu · modifié le ' + fmtStamp(nd.meta.modified) + '</span></div>';
      if (p.older) left += '<div class="note" style="margin-top:8px">' + icon('alert') + '<span>Ce classeur semble plus ancien que la version actuelle (' + fmtStamp(d.meta.modified) + ').</span></div>';
      left += '<dl class="kv" style="margin-top:14px"><dt>Période</dt><dd>' + esc(S.fmtRange(nd.meta.rangeStart, nd.meta.rangeEnd)) + '</dd><dt>Mes séances</dt><dd>' + nm.length + '</dd><dt>Examens</dt><dd>' + nm.filter((s) => s.exam).length + '</dd></dl>';
      const df = p.diff;
      left += '<h3 class="h-sec">Changements à partir d’aujourd’hui</h3>';
      if (!df.total) left += '<p class="muted small" style="margin:0">Aucun changement pour tes groupes.</p>';
      else {
        const pl = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');
        left += '<div class="counts"><span class="add">+' + pl(df.added.length, 'ajoutée') + '</span><span class="mod">' + pl(df.changed.length, 'modifiée') + '</span><span class="del">−' + pl(df.removed.length, 'supprimée') + '</span></div><div class="diff">';
        const when = (s) => S.fmtDateShort(s.date) + ' ' + S.fmtTime(s.start);
        const what = (s) => S.titleOf(s) + ' (' + S.badgeOf(s).label + ') · ' + placeText(s);
        const rows = [];
        df.changed.forEach((c) => rows.push([c.after.date + c.after.start, '<div class="mod"><span class="k">MODIFIÉE</span><span>' + esc(when(c.after) + ' · ' + what(c.after)) + '<br><s>' + esc(what(c.before)) + '</s></span></div>']));
        df.added.forEach((s) => rows.push([s.date + s.start, '<div class="add"><span class="k">AJOUTÉE</span><span>' + esc(when(s) + ' · ' + what(s)) + '</span></div>']));
        df.removed.forEach((s) => rows.push([s.date + s.start, '<div class="del"><span class="k">SUPPRIMÉE</span><span><s>' + esc(when(s) + ' · ' + what(s)) + '</s></span></div>']));
        rows.sort((a, b) => a[0].localeCompare(b[0]));
        left += rows.slice(0, 12).map((r) => r[1]).join('') + '</div>' + (rows.length > 12 ? '<p class="muted small">… et ' + (rows.length - 12) + ' autre(s).</p>' : '');
      }
      if (nd.warnings.length) left += '<h3 class="h-sec">Avertissements de lecture</h3><ul class="checks">' + nd.warnings.slice(0, 8).map((w) => '<li><span>' + esc(w.text) + '</span></li>').join('') + '</ul>';
      left += '<div class="acts"><button type="button" class="btn lime" data-act="apply">' + icon('check') + 'Appliquer</button><button type="button" class="btn" data-act="cancel">Annuler</button></div>';
    }
    left += '</section>' + (CAN_DOWNLOAD ? '<section class="panel"><h2 class="panel-t">Emporter la version à jour</h2><p class="muted small" style="margin-top:0">Un seul fichier HTML avec l’application et le planning actuel, utilisable hors ligne.</p>' +
      '<button type="button" class="btn ink" data-act="export">' + icon('download') + 'Télécharger l’application</button></section>' : '');
    let right = '<section class="panel"><h2 class="panel-t">Planning actuel <span class="tag ' + (state.source === 'imported' ? 'tp">Importé' : 'cm">Intégré') + '</span></h2><dl class="kv">' +
      '<dt>Classeur</dt><dd>' + esc(d.meta.sourceName || 'EDT') + '</dd><dt>Modifié le</dt><dd>' + fmtStamp(d.meta.modified) + '</dd>' +
      '<dt>Période</dt><dd>' + esc(S.fmtRange(d.meta.rangeStart, d.meta.rangeEnd)) + '</dd>' +
      '<dt>Semaines</dt><dd>' + d.weeks.length + (d.weeks.some((w) => !w.filled) ? ' (' + d.weeks.filter((w) => !w.filled).length + ' vide)' : '') + '</dd>' +
      '<dt>Mes séances</dt><dd>' + mine.length + '</dd><dt>Examens</dt><dd>' + mine.filter((s) => s.exam).length + '</dd></dl>' +
      (state.source === 'imported' ? '<div class="acts"><button type="button" class="btn" data-act="reset">' + icon('refresh') + 'Revenir à la version intégrée</button></div>' : '') + '</section>';
    right += '<section class="panel"><h2 class="panel-t">Apparence</h2><div class="seg" role="group" aria-label="Apparence">' +
      ['auto', 'light', 'dark'].map((t) => '<button type="button" data-act="set-theme" data-theme="' + t + '" aria-pressed="' + (state.theme === t) + '">' + icon(THEME_ICON[t]) + THEMES[t] + '</button>').join('') +
      '</div><p class="muted small" style="margin-bottom:0">' + (state.theme === 'auto' ? 'Suit le réglage clair/sombre de ton téléphone.' : 'Mode ' + THEMES[state.theme].toLowerCase() + ' imposé, quel que soit le réglage du téléphone.') + '</p></section>';
    right += '<section class="panel"><h2 class="panel-t">Mes groupes</h2>' +
      '<div class="field"><label for="g-td">TD</label><select id="g-td" data-act="group" data-k="td">' + opt(gi.td, state.groups.td) + '</select></div>' +
      '<div class="field"><label for="g-tp">TP</label><select id="g-tp" data-act="group" data-k="tp">' + opt(gi.tp, state.groups.tp) + '</select></div>' +
      '<p class="muted small" style="margin-bottom:0">Les CM et les examens communs sont toujours affichés.</p></section>';
    right += '<section class="panel"><h2 class="panel-t">À vérifier</h2>' + (!unknown.length ? '<p class="muted small" style="margin:0">Toutes les prochaines séances ont une salle ou la mention « En ligne ».</p>' :
      '<p class="muted small" style="margin-top:0">Salle non précisée dans le classeur (' + unknown.length + ') :</p><ul class="checks">' + unknown.slice(0, 8).map((s) => '<li><span class="w">' + esc(S.fmtDateShort(s.date) + ' ' + S.fmtTime(s.start)) + '</span><span>' + esc(S.titleOf(s) + ' · ' + S.badgeOf(s).label) + '</span></li>').join('') + '</ul>' + (unknown.length > 8 ? '<p class="muted small">… et ' + (unknown.length - 8) + ' autre(s).</p>' : '')) + '</section>';
    return '<div class="dgrid"><div class="col">' + left + '</div><div class="col">' + right + '</div></div>';
  }

  /* ---------- Rendu principal ---------- */
  function shellHTML() {
    const link = (v, ic, label, short) => '<a href="' + hashFor(v, state.date) + '" data-go="' + hashFor(v, state.date) + '"' + (state.view === v ? ' aria-current="page"' : '') + '>' + icon(ic) + '<span>' + (short || label) + '</span></a>';
    const onToday = state.view === 'week' ? (today() >= S.mondayOf(state.date) && today() <= S.addDays(S.mondayOf(state.date), 6)) : state.date === today();
    return '<header class="bar"><div class="wrap bar-in"><a class="logo" href="' + hashFor('day', today()) + '" data-go="' + hashFor('day', today()) + '"><i>C</i><span class="lt">Campus</span> <small>· Mon programme</small></a>' +
      '<nav class="tabs" aria-label="Vues">' + link('day', 'day', 'Jour') + link('week', 'week', 'Semaine') + link('data', 'data', 'Données') + '</nav>' +
      '<div class="ctrl"><button type="button" class="btn round" data-act="theme" aria-label="Apparence : ' + THEMES[state.theme] + ' (changer)" title="Apparence : ' + THEMES[state.theme] + '">' + icon(THEME_ICON[state.theme]) + '</button>' + (state.view === 'data' ? '' :
        '<button type="button" class="btn round arrowbtn" data-act="prev" aria-label="Précédent">' + icon('left') + '</button>' +
        '<button type="button" class="btn' + (onToday ? '' : ' on') + '" data-act="today">Aujourd’hui</button>' +
        '<button type="button" class="btn round arrowbtn" data-act="next" aria-label="Suivant">' + icon('right') + '</button>' +
        '<label class="btn round pick" title="Choisir une date">' + icon('calendar') + '<span class="sr">Choisir une date</span><input type="date" data-act="pick" value="' + state.date + '"></label>') +
      '</div></div></header>' +
      '<main class="wrap page" id="main">' + headHTML() + (state.view === 'data' ? viewData() : state.view === 'week' ? viewWeek() : viewDay()) + '</main>' +
      '<nav class="dock" aria-label="Navigation">' + link('day', 'day', 'Jour') + link('week', 'week', 'Semaine') + link('data', 'data', 'Données') + '</nav>';
  }

  function render(changedView) {
    try {
      const root = $app();
      root.className = 'app';
      root.innerHTML = shellHTML();
      document.title = 'Campus · Mon programme';
      if (changedView) window.scrollTo(0, 0);
      onScroll();
      bindDrop();
    } catch (e) { showFatal(e); }
  }
  function onScroll() { const b = document.querySelector('.bar'); if (b) b.classList.toggle('scrolled', window.scrollY > 4); }

  /* ---------- Import / export ---------- */
  async function handleFile(file) {
    if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) { toast('Choisis un fichier Excel .xlsx'); return; }
    toast('Lecture du classeur…');
    try {
      const u8 = new Uint8Array(await file.arrayBuffer());
      const nd = await P.parseWorkbook(u8, { sourceName: file.name.replace(/\.xlsx$/i, '') });
      const err = S.validateDataset(nd); if (err) throw new Error(err);
      if (!nd.sessions.length) throw new Error('Aucune séance reconnue dans ce classeur.');
      const older = !!(nd.meta.modified && state.data.meta.modified && nd.meta.modified < state.data.meta.modified);
      state.pending = { data: nd, name: file.name, older, diff: S.diffDatasets(state.data, nd, state.groups, today()) };
      const tt = document.querySelector('.toast'); if (tt) tt.remove();
      render();
    } catch (e) {
      toast('Lecture impossible : ' + (e && e.message ? e.message : 'fichier illisible'));
    }
  }
  function applyPending() {
    const nd = state.pending.data;
    nd.meta.importedAt = new Date().toISOString();
    const saved = store.set(KEY_DATA, JSON.stringify(nd));
    state.data = nd; state.source = 'imported'; state.pending = null;
    render();
    toast(saved ? 'Planning mis à jour sur cet appareil.' : 'Planning mis à jour (non mémorisé : stockage indisponible). Télécharge l’application à jour pour le garder.');
  }
  function exportHTML() {
    const json = JSON.stringify(state.data).replace(/</g, '\\u003c');
    const open = '<script id="campus-data" type="application/' + 'json">';
    const i = PRISTINE.indexOf(open);
    const j = i < 0 ? -1 : PRISTINE.indexOf('</' + 'script>', i);
    if (i < 0 || j < 0) { toast('Export impossible : modèle de page introuvable.'); return; }
    const html = PRISTINE.slice(0, i + open.length) + json + PRISTINE.slice(j);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Campus-Mon-programme.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Fichier « Campus-Mon-programme.html » téléchargé.');
  }
  function bindDrop() {
    const dz = document.getElementById('drop'); if (!dz) return;
    ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', (e) => { const f = e.dataTransfer && e.dataTransfer.files[0]; handleFile(f); });
  }

  /* ---------- Interactions ---------- */
  function step(dir) {
    const n = state.view === 'week' ? 7 : 1;
    go(state.view, S.addDays(state.date, dir * n));
  }
  function onClick(e) {
    const t = e.target.closest('[data-act],[data-date],[data-go]');
    if (!t) return;
    if (t.dataset.go) { e.preventDefault(); const r = parseHashStr(t.dataset.go); if (r) go(r.view, r.date); return; }
    if (t.dataset.date) { go('day', t.dataset.date); return; }
    switch (t.dataset.act) {
      case 'view-day': go('day', state.date); break;
      case 'view-week': go('week', state.date); break;
      case 'prev': step(-1); break;
      case 'next': step(1); break;
      case 'today': go(state.view === 'data' ? 'day' : state.view, today()); break;
      case 'apply': applyPending(); break;
      case 'cancel': state.pending = null; render(); break;
      case 'export': exportHTML(); break;
      case 'reset': store.del(KEY_DATA); state.data = state.embedded; state.source = 'embedded'; render(); toast('Version intégrée rétablie.'); break;
      case 'retry': boot(); break;
      case 'theme': { const order = ['auto', 'light', 'dark']; setTheme(order[(order.indexOf(state.theme) + 1) % 3]); render(); toast('Apparence : ' + THEMES[state.theme] + (state.theme === 'auto' ? ' (selon le téléphone)' : '')); break; }
      case 'set-theme': setTheme(t.dataset.theme); render(); break;
      default: break;
    }
  }
  function onChange(e) {
    const t = e.target;
    if (t.dataset.act === 'pick' && S.isValidISO(t.value)) go(state.view, t.value);
    else if (t.dataset.act === 'file') handleFile(t.files && t.files[0]);
    else if (t.dataset.act === 'group') { state.groups[t.dataset.k] = t.value; saveSettings(); state.pending = null; render(); toast('Groupes enregistrés : TD ' + state.groups.td + ' · TP ' + state.groups.tp); }
  }
  function onKey(e) {
    if (e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey || state.view === 'data') return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 't' || e.key === 'T') go(state.view, today());
    else if (e.key === 'j' || e.key === 'J') go('day', state.date);
    else if (e.key === 's' || e.key === 'S') go('week', state.date);
  }
  let touch = null;
  function onTouchStart(e) { if (!e.target.closest('#view') || state.view === 'data') { touch = null; return; } const p = e.changedTouches[0]; touch = { x: p.clientX, y: p.clientY, t: Date.now() }; }
  function onTouchEnd(e) {
    if (!touch) return;
    const p = e.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    if (Date.now() - touch.t < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 45) step(dx < 0 ? 1 : -1);
    touch = null;
  }
  function tick() {
    if (!state.booted) return;
    const n = S.nowInZone();
    if (n.date === state.now.date && n.minutes === state.now.minutes) return;
    const followToday = state.date === state.now.date && n.date !== state.now.date;
    state.now = n;
    if (state.view === 'data') return;
    if (followToday) go(state.view, n.date, true); else render();
  }

  /* ---------- Démarrage ---------- */
  function showFatal(e) {
    const msg = e && e.message ? e.message : String(e);
    const hasStored = !!store.get(KEY_DATA);
    const el = $app() || document.body;
    el.innerHTML = '<div class="fail" role="alert"><h2>Impossible d’afficher le programme</h2>' +
      '<p>Une erreur a empêché l’affichage. Tes données ne sont pas perdues.</p><code>' + esc(msg) + '</code>' +
      '<div class="acts" style="justify-content:center"><button type="button" class="btn ink" data-act="retry">' + icon('refresh') + 'Réessayer</button>' +
      (hasStored ? '<button type="button" class="btn" id="fail-reset">Revenir à la version intégrée</button>' : '') + '</div></div>';
    const r = document.getElementById('fail-reset');
    if (r) r.addEventListener('click', () => { store.del(KEY_DATA); boot(); });
    if (!state.booted) { const rb = el.querySelector('[data-act="retry"]'); if (rb) rb.addEventListener('click', () => location.reload()); }
  }

  let listening = false;
  function boot() {
    try {
      state.now = S.nowInZone();
      state.embedded = readEmbedded();
      loadSettings();
      applyTheme();
      chooseDataset();
      if (!listening) {
        document.addEventListener('click', onClick);
        document.addEventListener('change', onChange);
        document.addEventListener('keydown', onKey);
        document.addEventListener('touchstart', onTouchStart, { passive: true });
        document.addEventListener('touchend', onTouchEnd, { passive: true });
        window.addEventListener('hashchange', onHashChange);
        window.addEventListener('popstate', onHashChange);
        window.addEventListener('scroll', onScroll, { passive: true });
        document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
        try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'auto') applyTheme(); }); } catch (e) { /* ancien navigateur */ }
        setInterval(tick, 15000);
        listening = true;
      }
      const r = parseHash();
      state.view = r.view; state.date = r.date;
      syncHash(false);
      state.booted = true;
      window.__campusBooted = true;
      render(true);
    } catch (e) { showFatal(e); }
  }

  boot();
})();
</script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} });</script>
