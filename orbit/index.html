<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://api.anthropic.com https://generativelanguage.googleapis.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="orbit-build" content="20261121194035">
<meta name="theme-color" content="#06070d">
<title>Orbit · Tâches, notes & rappels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070d;--glass:rgba(var(--ink),.045);--glass2:rgba(var(--ink),.075);--line:rgba(var(--ink),.09);--line2:rgba(var(--ink),.16);--tx:#eef0ff;--mu:#959cbd;--mu2:#666d8f;--cy:#3be8ff;--vi:#9d7bff;--pk:#ff5fa2;--gr:#3dffa8;--am:#ffc35c;--rd:#ff5c7a;--font:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ink:255,255,255;--panel:rgba(8,9,18,.55);--sheet:rgba(14,16,30,.97);--well:rgba(0,0,0,.25);--tx2:#d0d4ee;--code:#a6f4ff;--codebg:rgba(59,232,255,.09);--opt:#14162c;--orb:1;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5fb;--glass:rgba(255,255,255,.72);--glass2:#fff;--line:rgba(24,32,80,.1);--line2:rgba(24,32,80,.18);--tx:#141836;--mu:#5a6182;--mu2:#8b91ad;--cy:#0b9fbd;--vi:#6a48f5;--pk:#dc3479;--gr:#0e9e64;--am:#bf7e00;--rd:#dd3556;--ink:24,32,80;--panel:rgba(255,255,255,.7);--sheet:rgba(255,255,255,.98);--well:rgba(24,32,80,.035);--tx2:#2c3255;--code:#0a6f86;--codebg:rgba(11,159,189,.1);--opt:#fff;--orb:.45;color-scheme:light}
body,.side,.drawer,.m-card,.toast,.task,.kpi,.ncard,.cls{transition:background-color .35s,border-color .35s,color .35s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}
::selection{background:rgba(59,232,255,.3)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(var(--ink),.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);scale:1;animation:float 26s ease-in-out infinite alternate}
.o1{width:560px;height:560px;background:#3420ff;top:-200px;left:-140px;opacity:.32}
.o2{width:480px;height:480px;background:#00b8ff;bottom:-200px;right:-120px;animation-delay:-9s;opacity:.22}
.o3{width:360px;height:360px;background:#ff2fa0;top:42%;left:48%;animation-delay:-15s;opacity:.11}
@keyframes float{to{transform:translate(90px,70px) scale(1.15)}}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--ink),.03) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ink),.03) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000 25%,transparent 72%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
.side{display:flex;flex-direction:column;gap:16px;padding:22px 16px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 6px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#8af6ff,#6a4dff 60%,#24157a);box-shadow:0 0 26px -4px rgba(122,244,255,.7);flex:none}
.logo svg{width:22px;height:22px}
.brand b{font-size:18px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;white-space:nowrap;font:10.5px var(--mono);color:var(--mu2);letter-spacing:.03em}
.search-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(var(--ink),.03);color:var(--mu);font:13.5px var(--font);cursor:pointer;text-align:left;transition:.15s}
.search-btn:hover{border-color:var(--line2);color:var(--tx)}
.search-btn kbd{margin-left:auto}
#nav{display:flex;flex-direction:column;gap:3px}
#nav .nav-it{width:100%;border:0;background:none;font-family:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--mu);text-decoration:none;font-weight:500;font-size:14.5px;transition:.15s;position:relative}
#nav .nav-it:hover{color:var(--tx);background:rgba(var(--ink),.04)}
#nav .nav-it.on{color:var(--tx);background:linear-gradient(90deg,rgba(59,232,255,.14),rgba(157,123,255,.05));box-shadow:inset 0 0 0 1px rgba(59,232,255,.18)}
#nav .nav-it.on::before{content:'';position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--cy);box-shadow:0 0 12px var(--cy)}
#nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--mu2)}
#nav .nav-it.on .cnt{color:var(--cy)}
#nav .nav-it .lbl-s{display:none}
#nav .cnt.hot{color:var(--pk)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.rem-info{font:11px/1.6 var(--mono);color:var(--mu2);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(var(--ink),.02)}
.rem-info b{color:var(--mu);font-weight:500}
.sync{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--mu2);padding:0 4px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mu2);flex:none}
.sync.on i{background:var(--gr);box-shadow:0 0 8px var(--gr)}
.sync.busy i{background:var(--am);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:6px}.foot-row .row{flex-wrap:nowrap;flex:none}.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sync{min-width:0}
/* main */
main{overflow-y:auto;padding:34px clamp(18px,4vw,56px) 90px;position:relative}
#view{max-width:1060px;margin:0 auto}
#view.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.topbar{display:none;align-items:center;gap:8px;margin-bottom:18px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:clamp(28px,3.6vw,40px);font-weight:600;letter-spacing:-.025em;line-height:1.08}
.grad{background:linear-gradient(90deg,#fff 10%,#c3ccff 45%,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin-top:6px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.muted{color:var(--mu)}
.sp{flex:1}
kbd{font:11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--mu);background:rgba(var(--ink),.04)}
/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;border:1px solid var(--line2);background:rgba(var(--ink),.05);color:var(--tx);font:500 13.5px var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(var(--ink),.1);border-color:rgba(var(--ink),.26)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.primary{background:linear-gradient(135deg,var(--cy),var(--vi));color:#060714;border:0;font-weight:600;box-shadow:0 8px 26px -10px rgba(59,232,255,.7)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.sm .i{width:15px;height:15px}
.btn.danger:hover{color:var(--rd);border-color:rgba(255,92,122,.5);background:rgba(255,92,122,.08)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mu);cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{background:rgba(var(--ink),.07);color:var(--tx)}
.icon-btn.sm{width:26px;height:26px}.icon-btn.sm .i{width:14px;height:14px}
.pill{border:1px solid var(--line);background:rgba(var(--ink),.03);color:var(--mu);font:500 12px var(--font);padding:4px 10px;border-radius:99px;cursor:pointer;transition:.15s}
.pill:hover,.pill.on{color:var(--tx);border-color:rgba(59,232,255,.45);background:rgba(59,232,255,.09)}
.mic,.ai{display:none!important}
.has-dict .mic{display:inline-grid!important}
.has-ai .ai{display:inline-flex!important}
.mic.on{color:var(--pk)!important;background:rgba(255,95,162,.12)!important;animation:micp 1.2s infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px rgba(255,95,162,.12)}}
/* quick add */
.quick{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:16px;background:rgba(var(--ink),.05);border:1px solid var(--line2);transition:.2s}
.quick:focus-within{border-color:rgba(59,232,255,.55);box-shadow:0 0 0 4px rgba(59,232,255,.09),0 14px 44px -14px rgba(59,232,255,.4)}
.quick>.i{color:var(--cy)}
.quick input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:16px var(--font);padding:10px 0;min-width:0}
.quick input::placeholder{color:var(--mu2)}
.qprev{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:24px;margin:9px 4px 22px;font-size:12.5px;color:var(--mu2)}
/* chips */
.chip{font:500 11.5px var(--mono);padding:2px 8px;border-radius:99px;background:rgba(var(--ink),.055);color:var(--mu);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.chip .i{width:12px;height:12px}
.chip.late{color:var(--rd);background:rgba(255,92,122,.11)}
.chip.today{color:var(--cy);background:rgba(59,232,255,.09)}
.chip.doing{color:var(--am);background:rgba(255,195,92,.1)}
.chip.p3{color:var(--pk);background:rgba(255,95,162,.1)}
.chip.tag{color:hsl(var(--h) 90% 74%);background:hsl(var(--h) 90% 60% / .1)}
:root[data-theme=light] .chip.tag{color:hsl(var(--h) 75% 34%);background:hsl(var(--h) 80% 50% / .12)}
.chip.rev{color:var(--vi);background:rgba(157,123,255,.12)}
/* hero & kpis */
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(var(--ink),.07);stroke-width:8}
.ring .arc{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(59,232,255,.55))}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 20px/1 var(--font)}
.ring .v small{font:10px var(--mono);color:var(--mu2);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 28px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi b{display:block;font:600 28px/1.1 var(--font);letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--mu)}
.kpi::after{content:'';position:absolute;right:-24px;top:-24px;width:76px;height:76px;border-radius:50%;background:var(--k,var(--cy));filter:blur(30px);opacity:.28}
/* sections & lists */
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h3{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.sec-h h3.late{color:var(--rd)}
.sec-h .n{font:500 11px var(--mono);color:var(--mu2);background:rgba(var(--ink),.05);padding:1px 7px;border-radius:99px}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 16px;border:1px solid var(--line);background:var(--glass);border-radius:14px;transition:background .18s,border-color .18s,transform .18s;position:relative;cursor:pointer;--pc:var(--cy)}
.task:hover{border-color:var(--line2);background:var(--glass2);transform:translateY(-1px)}
.task::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--pc);box-shadow:0 0 10px var(--pc);opacity:.85}
.p3{--pc:var(--pk)}.p2{--pc:var(--cy)}.p1{--pc:#6f76a0}
.task.new{animation:slidein .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px) scale(.98);box-shadow:0 0 0 2px var(--cy)}}
.check{flex:none;width:22px;height:22px;border-radius:7px;border:1.7px solid var(--pc,var(--line2));background:transparent;display:grid;place-items:center;cursor:pointer;margin-top:1px;transition:.15s;color:transparent;padding:0}
.check .i{width:14px;height:14px;stroke-width:3}
.check:hover{color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 18%,transparent)}
.done>.check{background:var(--gr);border-color:var(--gr);color:#04140c}
.tb{flex:1;min-width:0}
.ttl{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.task.done .ttl{text-decoration:line-through;color:var(--mu2)}
.task.done{opacity:.75}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bar{height:3px;border-radius:3px;background:rgba(var(--ink),.07);margin-top:9px;overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));border-radius:3px;transition:width .4s}
.task .ghost-i{opacity:0;transition:.15s}
.task:hover .ghost-i{opacity:1}
.empty{text-align:center;padding:44px 20px;border:1px dashed var(--line2);border-radius:20px;color:var(--mu)}
.empty .big{font-size:38px;margin-bottom:8px}
.empty h3{color:var(--tx);font-weight:600;margin-bottom:4px}
.mini-empty{color:var(--mu2);font-size:13.5px;padding:6px 2px}
.rem-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(157,123,255,.08),rgba(59,232,255,.04));font-size:13.5px;color:var(--mu)}
.rem-card .i{color:var(--vi)}
.rem-card b{color:var(--tx);font-weight:500}
details.done-box summary{cursor:pointer;list-style:none}
details.done-box summary::-webkit-details-marker{display:none}
/* notes */
.ngrid{columns:3 250px;column-gap:14px}
.ncard{break-inside:avoid;margin-bottom:14px;padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.18s;position:relative;display:block}
.ncard:hover{border-color:var(--line2);transform:translateY(-2px);background:var(--glass2)}
.ncard.pinned{border-color:rgba(157,123,255,.38);background:linear-gradient(180deg,rgba(157,123,255,.1),rgba(var(--ink),.025))}
.ncard h4{font-size:15.5px;font-weight:600;margin-bottom:6px;padding-right:22px;overflow-wrap:anywhere}
.ncard .pin{position:absolute;top:14px;right:14px;color:var(--vi)}
.ncard .pin .i{width:15px;height:15px}
.ncard .meta{margin-top:10px}
.ncard.linked{border-style:dashed}
.clamp{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.rev-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rev-card{padding:14px 16px;border-radius:14px;border:1px solid rgba(157,123,255,.3);background:rgba(157,123,255,.07)}
.rev-card h4{font-size:14.5px;margin-bottom:4px;cursor:pointer}
.rev-card .row{margin-top:10px}
.search-in{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ink),.03);min-width:240px}
.search-in input{background:none;border:0;outline:0;color:var(--tx);font:14px var(--font);padding:9px 0;flex:1;min-width:0}
.search-in .i{color:var(--mu2)}
/* markdown */
.md{font-size:14px;color:var(--tx2);line-height:1.62;overflow-wrap:anywhere}
.md>*+*{margin-top:.5em}
.md h1,.md h2,.md h3{color:var(--tx);font-size:1.08em;font-weight:600;letter-spacing:0}
.md code{font:12.5px var(--mono);background:var(--codebg);color:var(--code);padding:1px 5px;border-radius:5px}
.md pre{background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
.md pre code{background:none;padding:0;color:var(--tx2)}
.md ul,.md ol{padding-left:1.3em}
.md li.cb{list-style:none;margin-left:-1.2em}
.md blockquote{border-left:2px solid var(--vi);padding-left:10px;color:var(--mu)}
.md a{color:var(--cy)}
.md b{color:var(--tx)}
.md.edit-hint{cursor:text;min-height:80px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--well)}
/* board */
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 16px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:rgba(var(--ink),.025);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:220px;transition:.15s}
.col.over{border-color:rgba(59,232,255,.55);background:rgba(59,232,255,.05);box-shadow:inset 0 0 30px -10px rgba(59,232,255,.3)}
.col-h{display:flex;align-items:center;gap:8px;font:600 13.5px var(--font);padding:4px 4px 12px}
.col-h span{margin-left:auto;font:500 11px var(--mono);color:var(--mu2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.todo{background:var(--mu)}.dot.doing{background:var(--am);box-shadow:0 0 10px var(--am)}.dot.done{background:var(--gr);box-shadow:0 0 10px var(--gr)}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mu2);font-size:13px}
.task.dragging{opacity:.35}
/* upcoming */
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 0 9px}
.day-h b{font-size:16px;font-weight:600}
.day-h small{font:11px var(--mono);color:var(--mu2)}
.day-h .icon-btn{margin-left:auto}
.day-h.late b{color:var(--rd)}
/* focus */
.focus-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:6px}
.ring-big{width:min(320px,78vw);aspect-ratio:1;position:relative}
.ring-big svg{width:100%;height:100%}
.ring-big .trk{fill:none;stroke:rgba(var(--ink),.06);stroke-width:10}
.ring-big .arc{fill:none;stroke:url(#fg);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(59,232,255,.55));transition:stroke-dashoffset .5s linear}
.ring-big.break .arc{stroke:var(--gr);filter:drop-shadow(0 0 12px rgba(61,255,168,.5))}
.ring-big.running::after{content:'';position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,rgba(59,232,255,.12),transparent 70%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.5}}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:48px;z-index:1}
.f-time{font:500 clamp(48px,9vw,68px)/1 var(--mono);letter-spacing:-.04em}
.f-task{font-size:13.5px;color:var(--mu);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-ctrl{display:flex;gap:16px;align-items:center}
.f-play{width:70px;height:70px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cy),var(--vi));color:#060714;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 40px -8px rgba(59,232,255,.7);transition:.15s}
.f-play:hover{transform:scale(1.05)}
.f-play .i{width:26px;height:26px;stroke-width:2.4}
.f-opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.f-opts select{max-width:280px}
.f-sess{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px}
.f-sess i{width:10px;height:10px;border-radius:50%;background:rgba(var(--ink),.1)}
.f-sess i.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}
/* stats */
.panel{padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);margin-bottom:16px}
.panel h3{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:24px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;min-width:0}
.bv{width:100%;max-width:32px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--cy),rgba(59,232,255,.12));min-height:3px;position:relative}
.bv.vi{background:linear-gradient(180deg,var(--vi),rgba(157,123,255,.12))}
.bv::after{content:attr(data-v);position:absolute;top:-19px;left:50%;transform:translateX(-50%);font:10.5px var(--mono);color:var(--mu)}
.bcol small{font:10px var(--mono);color:var(--mu2)}
.bcol.today small{color:var(--cy)}
.tagstat{display:grid;grid-template-columns:120px 1fr 60px;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}
.tagstat .bar{max-width:none;margin:0;height:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100vw);z-index:40;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--line2);transform:translateX(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-30px 0 80px -20px rgba(0,0,0,.75)}
.drawer.open{transform:none}
#scrim{position:fixed;inset:0;z-index:39;background:rgba(3,4,10,.5);opacity:0;pointer-events:none;transition:.25s}
#scrim.open{opacity:1;pointer-events:auto}
.d-in{padding:18px 24px 30px;display:flex;flex-direction:column;gap:20px}
.d-top{display:flex;align-items:center;gap:8px}
.d-title{display:flex;gap:12px;align-items:flex-start}
.d-title .check{width:26px;height:26px;margin-top:5px;border-radius:8px}
.ttl-in{flex:1;background:none;border:0;outline:0;color:var(--tx);font:600 22px/1.3 var(--font);resize:none;overflow:hidden;letter-spacing:-.01em;padding:0}
.d-title.done .ttl-in{text-decoration:line-through;color:var(--mu)}
.fields{display:grid;gap:14px}
.fl{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:12px}
.fl>label{font-size:12.5px;color:var(--mu)}
.fl .stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp,.fields input:not([type=checkbox]),.fields select,.f-opts select{width:100%;background:rgba(var(--ink),.04);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:8px 11px;font:14px var(--font);outline:0;transition:.15s}
.fields .row input{width:auto;flex:1;min-width:120px}
.inp:focus,.fields input:focus,.fields select:focus{border-color:rgba(59,232,255,.5)}
select option{background:var(--opt);color:var(--tx)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(var(--ink),.04);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mu);font:500 13px var(--font);padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:rgba(var(--ink),.1);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(var(--ink),.12)}
.seg.sm button{padding:4px 10px;font-size:12px}
.days{display:flex;gap:5px;margin-top:8px}
.days button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--mu);font:600 12px var(--mono);cursor:pointer}
.days button.on{background:rgba(59,232,255,.14);border-color:rgba(59,232,255,.5);color:var(--cy)}
.d-sec{border-top:1px solid var(--line);padding-top:16px}
.d-sec .sec-h h4{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.d-sec .sec-h h4 span{color:var(--mu2);margin-left:4px}
.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:10px;padding:3px 6px;border-radius:9px;--pc:var(--vi)}
.sub:hover{background:rgba(var(--ink),.03)}
.sub .check{width:18px;height:18px;border-radius:6px;margin:0}
.sub .check .i{width:11px;height:11px}
.sub-text{flex:1;background:none;border:0;outline:0;color:var(--tx);font:14px var(--font);padding:5px 0;min-width:0}
.sub.done .sub-text{text-decoration:line-through;color:var(--mu2)}
.sub .icon-btn{opacity:0}.sub:hover .icon-btn{opacity:1}
.sub-add{width:100%;margin-top:6px;background:none;border:1px dashed var(--line2);border-radius:10px;color:var(--tx);padding:9px 12px;font:14px var(--font);outline:0}
.sub-add:focus{border-color:rgba(157,123,255,.6)}
.note-in{width:100%;min-height:200px;background:var(--well);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px 14px;font:13.5px/1.6 var(--mono);outline:0;resize:vertical}
.note-in:focus{border-color:rgba(59,232,255,.45)}
.d-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px}
.d-foot .muted{display:flex;align-items:center;gap:6px}
.n-title{width:100%;background:none;border:0;outline:0;color:var(--tx);font:600 22px/1.3 var(--font);padding:0}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap}
/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px}
#modal.open{display:flex}
.m-scrim{position:absolute;inset:0;background:rgba(3,4,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.m-card{position:relative;width:min(560px,100%);max-height:84vh;overflow-y:auto;background:var(--sheet);border:1px solid var(--line2);border-radius:22px;padding:26px;box-shadow:0 40px 120px -20px rgba(0,0,0,.85);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.m-card h2{font-size:26px;letter-spacing:-.02em;margin:6px 0 4px}
.m-card .list{margin:16px 0}
.m-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.m-kpis{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.m-kpis div{flex:1;min-width:100px;padding:10px 12px;border-radius:12px;background:rgba(var(--ink),.04);border:1px solid var(--line)}
.m-kpis b{display:block;font-size:22px}
.m-kpis span{font-size:12px;color:var(--mu)}
.rv-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ink),.03)}
.rv-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-done{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mu);padding:3px 0}
.rv-done .i{color:var(--gr);width:15px;height:15px}
.tips{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(var(--ink),.035);border:1px solid var(--line);font-size:14px}
.tip .i{color:var(--cy);margin-top:2px}
.tip code{font:12.5px var(--mono);color:var(--code);background:var(--codebg);padding:1px 6px;border-radius:5px}
.set-h{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:22px 0 10px}
.hint{font-size:12.5px;color:var(--mu2);margin-top:10px;line-height:1.55}
.switch{position:relative;display:inline-block;width:42px;height:24px}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:rgba(var(--ink),.12);transition:.2s;cursor:pointer}
.switch i::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--cy)}
.switch input:checked+i::after{transform:translateX(18px)}
/* palette */
.m-card.pal{padding:0;overflow:hidden;width:min(620px,100%)}
.pal-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-in .i{color:var(--cy)}
.pal-in input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:17px var(--font)}
.pal-list{max-height:54vh;overflow-y:auto;padding:8px}
.pal-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mu)}
.pal-it span{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it.on{background:rgba(59,232,255,.1)}
.pal-it.on .i{color:var(--cy)}
.pal-it em{margin-left:auto;font:11px var(--mono);color:var(--mu2);font-style:normal;white-space:nowrap}
/* toasts & fx */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:94vw}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 16px;border-radius:14px;background:var(--sheet);border:1px solid var(--line2);box-shadow:0 20px 50px -10px rgba(0,0,0,.75);font-size:14px;animation:pop .25s;max-width:min(460px,94vw)}
.toast.rem{border-color:rgba(255,95,162,.45);box-shadow:0 20px 50px -10px rgba(0,0,0,.75),0 0 30px -10px rgba(255,95,162,.6)}
.toast span{color:var(--mu);font-size:13px}
.toast button{border:0;background:rgba(59,232,255,.13);color:var(--cy);font:600 12.5px var(--font);padding:6px 10px;border-radius:8px;cursor:pointer;flex:none}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
.pt{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:99;animation:pt .75s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
#dictBubble{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:85;padding:10px 16px;border-radius:14px;background:var(--sheet);border:1px solid rgba(255,95,162,.45);color:var(--tx);font-size:14px;max-width:80vw;display:none}
#dictBubble.on{display:block}
/* tour */
#tour{position:fixed;inset:0;z-index:95;display:none}
#tour.on{display:block}
#tourBlock{position:absolute;inset:0}
#tourHole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(3,4,12,.74),0 0 0 2px var(--cy),0 0 34px 6px rgba(59,232,255,.35);transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tourHole.center{box-shadow:0 0 0 9999px rgba(3,4,12,.74)}
:root[data-theme=light] #tourHole{box-shadow:0 0 0 9999px rgba(20,24,54,.5),0 0 0 2px var(--cy),0 0 30px 4px rgba(11,159,189,.3)}
:root[data-theme=light] #tourHole.center{box-shadow:0 0 0 9999px rgba(20,24,54,.5)}
#tourCard{position:fixed;width:min(370px,calc(100vw - 24px));padding:18px 18px 14px;border-radius:18px;background:var(--sheet);border:1px solid var(--line2);box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(59,232,255,.08);transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)}
#tourCard.pop{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
#tourCard h3{font-size:18.5px;margin:8px 0 6px;letter-spacing:-.015em;line-height:1.25}
#tourCard p{font-size:14px;color:var(--mu);line-height:1.6}
#tourCard p b{color:var(--tx);font-weight:600}
#tourCard kbd{font-size:10.5px}
.tc-top{display:flex;align-items:center;gap:8px}
.tc-top .icon-btn{margin-left:auto;width:28px;height:28px}
.tc-foot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.tdots{display:flex;gap:4px;align-items:center}
.tdots i{width:6px;height:6px;border-radius:3px;background:rgba(var(--ink),.18);transition:.3s}
.tdots i.on{background:var(--cy);width:18px}
.tdots i.done{background:rgba(59,232,255,.45)}
.tour-emoji{font-size:34px;line-height:1}
/* campus */
.prog{display:flex;flex-direction:column;gap:7px}
.cls{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);transition:.2s}
.cls .tm{font:500 12px/1.35 var(--mono);color:var(--mu2)}
.cls .tm b{display:block;color:var(--tx);font-size:14px;font-weight:600}
.cls .ttl{font-size:14.5px}
.cmeta{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mu);margin-top:3px;flex-wrap:wrap}
.cmeta .i{width:13px;height:13px}
.cls.now{border-color:rgba(59,232,255,.5);background:linear-gradient(90deg,rgba(59,232,255,.09),rgba(var(--ink),.03));box-shadow:0 0 0 3px rgba(59,232,255,.07)}
.cls.past{opacity:.45}
.cls.exam{border-color:rgba(255,92,122,.45);background:linear-gradient(90deg,rgba(255,92,122,.1),rgba(var(--ink),.02))}
.kb{font:600 10px var(--mono);letter-spacing:.04em;padding:2px 6px;border-radius:6px;margin-right:8px;vertical-align:1px;color:var(--mu);background:rgba(var(--ink),.07)}
.kb.CM{color:var(--cy);background:rgba(59,232,255,.11)}.kb.TD{color:var(--vi);background:rgba(157,123,255,.13)}.kb.TP{color:var(--gr);background:rgba(61,255,168,.1)}.kb.EXAM{color:var(--rd);background:rgba(255,92,122,.14)}.kb.EV{color:var(--am);background:rgba(255,195,92,.12)}
.free{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-radius:12px;border:1px dashed var(--line2);color:var(--mu);font-size:13px}
.free .tm{font:500 12px var(--mono);color:var(--mu2);min-width:78px}
.pill .i{width:13px;height:13px;vertical-align:-2px}
.holi{padding:11px 14px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,195,92,.13),rgba(255,195,92,.02));border:1px solid rgba(255,195,92,.3);font-size:14px}
.holi.ev{background:linear-gradient(90deg,rgba(157,123,255,.13),rgba(157,123,255,.02));border-color:rgba(157,123,255,.3)}
.cls-mini{display:flex;flex-wrap:wrap;gap:5px;margin:-2px 0 9px}
.exam-card{padding:14px 16px;border-radius:14px;border:1px solid rgba(255,92,122,.32);background:linear-gradient(180deg,rgba(255,92,122,.08),rgba(var(--ink),.02))}
.exam-card h4{font-size:15px;margin:8px 0 2px}
.exam-card.fin{border-color:rgba(255,195,92,.35);background:linear-gradient(180deg,rgba(255,195,92,.08),rgba(var(--ink),.02))}
.jn{font:600 11.5px var(--mono);padding:2px 8px;border-radius:7px;background:rgba(var(--ink),.08);color:var(--tx)}
.jn.hot{color:var(--rd);background:rgba(255,92,122,.16)}
.hint code{font:11.5px var(--mono);color:var(--code);background:var(--codebg);padding:1px 5px;border-radius:5px}
.day-h .chip{align-self:center}
/* mobile */

 .app{grid-template-columns:1fr}
 .side{position:fixed;bottom:0;left:0;right:0;z-index:30;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--sheet)}
 .side .brand,.side .search-btn,.side-foot{display:none}
 #nav{flex-direction:row;width:100%;justify-content:space-around;gap:0}

 main{padding:16px 14px 100px}

 .two{grid-template-columns:1fr}

 .free .tm{min-width:0}
}

:root[data-theme=light] .bg{opacity:.55}

:root[data-theme=light] .ring .arc,:root[data-theme=light] .ring-big .arc{filter:none}
:root[data-theme=light] .ncard.pinned{background:linear-gradient(180deg,rgba(106,72,245,.08),#fff)}
.theme-btn .i{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.theme-btn:hover .i{transform:rotate(40deg)}

/* ===== épuré ===== */
.gridbg{display:none}
.o1{opacity:.2}.o2{opacity:.12}.o3{display:none}
#view{max-width:1180px}

.stat-line{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--mu)}
.st b{color:var(--tx);font-weight:600;margin-right:5px;font-size:14px}
.st.bad b{color:var(--rd)}.st.good b{color:var(--gr)}.st.warm b{color:var(--am)}

.sec{margin-bottom:30px}
.sec-h{margin-bottom:10px}
.sec-h h3{font:600 15px var(--font);letter-spacing:-.01em;text-transform:none;color:var(--tx)}
.sec-h h3.late{color:var(--rd)}
.sec-h .n{background:none;padding:0;font-size:12px;color:var(--mu2)}
.link{background:none;border:0;color:var(--cy);font:500 13px var(--font);cursor:pointer;text-decoration:none;padding:0}
.link:hover{text-decoration:underline}
/* list rows instead of heavy cards */
.list{gap:0;border:1px solid var(--line);border-radius:16px;background:var(--glass);overflow:hidden}
.list .task{border:0;border-radius:0;background:transparent;border-bottom:1px solid var(--line);padding:13px 14px;transform:none!important}
.list .task:last-child{border-bottom:0}
.list .task:hover{background:rgba(var(--ink),.035)}
.list .task::before{top:16px;bottom:16px;width:2px;opacity:.7;box-shadow:none}
.list .mini-empty.pad{padding:16px}
.m-card .list{border:0;background:none;gap:0}
.check{border-radius:50%}
.task .meta{gap:4px 12px;margin-top:4px}
.task .meta .chip{background:none;padding:0;font-size:11.5px;color:var(--mu2)}
.task .meta .chip.late{color:var(--rd)}.task .meta .chip.today{color:var(--cy)}.task .meta .chip.doing{color:var(--am)}
.task .meta .chip.tag{color:hsl(var(--h) 70% 70%)}
:root[data-theme=light] .task .meta .chip.tag{color:hsl(var(--h) 70% 36%)}
.bar{height:2px;margin-top:8px;max-width:160px}
/* side column */
.col-side .sec-h h3{font-size:14px}
.col-side .prog{gap:0;border:1px solid var(--line);border-radius:16px;background:var(--glass);overflow:hidden}
.col-side .cls{border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;grid-template-columns:52px 1fr;gap:12px;box-shadow:none}
.col-side .cls .cst{grid-column:2}.col-side .cls .cst:empty{display:none}
.col-side .cls.now{background:rgba(59,232,255,.06);box-shadow:inset 2px 0 0 var(--cy)}
.col-side .cls.exam{background:rgba(255,92,122,.06);box-shadow:inset 2px 0 0 var(--rd)}
.col-side .free{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:9px 10px 9px 14px;font-size:12.5px}
.col-side .free .tm{min-width:52px;font-size:11px}
.col-side .prog>:last-child{border-bottom:0}
.col-side .holi{font-size:13px}
.col-side .rev-row{grid-template-columns:1fr}
.col-side .exam-card{padding:12px 14px}
.ngrid.one{columns:1}
.kpi::after{display:none}
.kpi{background:var(--glass)}
/* sidebar */
.side{gap:18px}
.brand small{font-size:10.5px}
#nav .nav-it{padding:9px 12px}
.rem-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0;border:0;background:none}
.rem-info button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--mu);cursor:pointer;text-align:left;font:500 12.5px var(--font);transition:.15s}
.rem-info button:hover{color:var(--tx);border-color:var(--line2)}
.rem-info button .i{width:16px;height:16px;color:var(--cy)}
.rem-info button:last-child .i{color:var(--vi)}
.rem-info small{display:block;font:10.5px var(--mono);color:var(--mu2)}
.foot-row .icon-btn{width:30px;height:30px}
.foot-row .icon-btn .i{width:17px;height:17px}

/* ===== style épuré (par défaut) ===== */
.pals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pal{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--glass);color:var(--tx);font:500 12.5px var(--font);cursor:pointer;transition:.15s}
.pal:hover{border-color:var(--line2)}
.pal .sw{display:flex}.pal .sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(var(--ink),.15)}.pal .sw i+i{margin-left:-5px}
.pal.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}

html[data-style=clean][data-theme] .task .meta .chip.late,html[data-style=clean][data-theme] .task .meta .chip.today,html[data-style=clean][data-theme] .task .meta .chip.doing{background:none}
html[data-style=clean][data-theme] .kb.CM{color:var(--cy);background:color-mix(in srgb,var(--cy) 12%,transparent)}

html[data-style=clean][data-theme] .kb.EXAM{color:var(--rd);background:color-mix(in srgb,var(--rd) 12%,transparent)}
html[data-style=clean][data-theme] .kb.EV{color:var(--am);background:color-mix(in srgb,var(--am) 14%,transparent)}
html[data-style=clean][data-theme] .kb{font-family:var(--font);letter-spacing:0}
html[data-style=clean][data-theme] .cls.now{background:color-mix(in srgb,var(--cy) 6%,var(--glass));border-color:color-mix(in srgb,var(--cy) 40%,transparent);box-shadow:none}
html[data-style=clean][data-theme] .col-side .cls.now{box-shadow:inset 2px 0 0 var(--cy)}
html[data-style=clean][data-theme] .cls.exam{background:color-mix(in srgb,var(--rd) 5%,var(--glass))}
html[data-style=clean][data-theme] .exam-card,html[data-style=clean][data-theme] .exam-card.fin,html[data-style=clean][data-theme] .rev-card{background:var(--glass);border-color:var(--line)}

html[data-style=clean][data-theme] .holi.ev{background:color-mix(in srgb,var(--vi) 8%,var(--glass));border-color:color-mix(in srgb,var(--vi) 25%,transparent)}
html[data-style=clean][data-theme] .ncard.pinned{background:var(--glass);border-color:color-mix(in srgb,var(--vi) 35%,transparent)}
html[data-style=clean][data-theme] .ncard:hover{transform:none}
html[data-style=clean][data-theme] .bv{background:var(--cy)}html[data-style=clean][data-theme] .bv.vi{background:var(--vi)}
html[data-style=clean][data-theme] .bar i{background:var(--cy)}
html[data-style=clean][data-theme] .tdots i.on{background:var(--cy)}html[data-style=clean][data-theme] .tdots i.done{background:color-mix(in srgb,var(--cy) 45%,transparent)}
html[data-style=clean][data-theme] .drawer{background:var(--sheet);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:-24px 0 60px -24px rgba(0,0,0,.25)}
html[data-style=clean][data-theme] .m-card{background:var(--sheet);box-shadow:0 24px 64px -16px rgba(0,0,0,.28)}
html[data-style=clean][data-theme] .m-scrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.35)}
html[data-style=clean][data-theme] #scrim{background:rgba(0,0,0,.22)}
html[data-style=clean][data-theme] .toast{background:var(--tx);color:var(--bg);border:0;box-shadow:0 12px 32px -8px rgba(0,0,0,.3)}
html[data-style=clean][data-theme] .toast span{color:color-mix(in srgb,var(--bg) 72%,transparent)}
html[data-style=clean][data-theme] .toast button{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
html[data-style=clean][data-theme] #tourHole{box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 0 2px var(--cy)!important}
html[data-style=clean][data-theme] #tourHole.center{box-shadow:0 0 0 9999px rgba(0,0,0,.45)!important}
html[data-style=clean][data-theme] #tourCard{background:var(--sheet);box-shadow:0 24px 64px -16px rgba(0,0,0,.35)}
html[data-style=clean][data-theme] .mic.on{color:var(--rd)!important;background:color-mix(in srgb,var(--rd) 10%,transparent)!important;animation:none}

html[data-style=clean][data-theme] .rem-info button .i,html[data-style=clean][data-theme] .rem-info button:last-child .i{color:var(--mu)}
html[data-style=clean][data-theme] .pal-it.on{background:rgba(var(--ink),.06)}html[data-style=clean][data-theme] .pal-it.on .i{color:var(--cy)}

html[data-style=clean][data-theme] .md blockquote{border-left-color:var(--line2)}
html[data-style=clean][data-theme] ::selection{background:color-mix(in srgb,var(--cy) 22%,transparent)}

html[data-style=clean][data-theme] .set-h,html[data-style=clean][data-theme] .d-sec .sec-h h4,html[data-style=clean][data-theme] .panel h3{text-transform:none;letter-spacing:-.005em;font:600 14px var(--font);color:var(--tx)}
html[data-style=clean][data-theme] .d-sec .sec-h h4 span{font-weight:400;color:var(--mu2)}

/* ===== gamification ===== */
.g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media(max-width:1000px){.g-grid{grid-template-columns:1fr}}
.g-card{padding:18px 20px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.g-card h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em;margin:2px 0 8px}
.g-level{display:flex;gap:18px;align-items:center}
.g-lv{width:76px;height:76px;border-radius:50%;background:var(--cy);display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px color-mix(in srgb,var(--cy) 14%,transparent)}
.g-lv span{color:var(--onacc,#fff);font:700 30px var(--font);letter-spacing:-.03em}
.g-lv.big{width:100px;height:100px;margin:6px auto 0}.g-lv.big span{font-size:40px}
.xpbar{height:8px;border-radius:8px;background:rgba(var(--ink),.08);overflow:hidden;margin:6px 0}
.xpbar i{display:block;height:100%;background:var(--cy);border-radius:8px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.sm{font-size:12.5px}
.g-station{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:16px;align-items:center}
@media(max-width:560px){.g-station{grid-template-columns:1fr}}
.station{width:100%;max-width:270px;display:block;margin:auto}
.station .orbit{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 7}
.station .strut{stroke:var(--line2);stroke-width:2.5}
.station .core{fill:var(--cy)}
.station .clv{fill:var(--onacc,#fff);font:700 32px var(--font)}
.station .cl2{fill:var(--onacc,#fff);opacity:.85;font:500 11px var(--font)}
.station .mlv{fill:#fff;font:700 13px var(--font)}
.station .mlab{fill:var(--mu);font:500 12px var(--font)}
.station .sring{fill:none;stroke:var(--onacc,#fff);stroke-width:2.5;opacity:.55}
.orb-rot{transform-origin:180px 180px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb-rot{animation:none}}
.dls{display:flex;flex-direction:column;gap:9px}
.dl{display:grid;grid-template-columns:10px 1fr auto;column-gap:9px;align-items:center;font-size:13.5px}
.dl i{width:10px;height:10px;border-radius:50%;grid-row:1/3}
.dl b{font-weight:600}.dl span{grid-column:2;color:var(--mu);font-size:12px}
.dl em{grid-row:1/3;grid-column:3;font-style:normal;font-size:12px;color:var(--mu)}.dl em.warn{color:var(--am)}
.quests{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--glass);overflow:hidden}
.g-card .quests{border:0;background:none;border-radius:0;margin:0 -4px}
.quest{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.quest:last-child{border-bottom:0}
.qc{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff}
.qc .i{width:12px;height:12px;stroke-width:3}
.quest.done .qc{background:var(--gr);border-color:var(--gr)}
.quest.done .qt span{text-decoration:line-through;color:var(--mu2)}
.qt{flex:1;min-width:0;display:flex;flex-direction:column}.qt small{color:var(--mu2);font-size:11.5px}
.quest em{font-style:normal;font-size:12px;font-weight:600;color:var(--cy);white-space:nowrap}
.quest.done em{color:var(--mu2)}
.streak-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.streakbig{display:flex;align-items:baseline;gap:8px}.streakbig b{font:700 32px var(--font);letter-spacing:-.03em}.streakbig span{color:var(--mu);font-size:13px}
.tokens{display:flex;gap:6px;margin-top:4px}
.tokens i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--ink),.06);font-style:normal;opacity:.3;font-size:15px}
.tokens i.on{opacity:1;background:rgba(56,189,248,.16)}
.bgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.boss{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
.boss h4{font-size:15px;margin:8px 0 6px}
.boss.dead{opacity:.6}
.hp{height:8px;border-radius:8px;background:color-mix(in srgb,var(--rd) 15%,transparent);overflow:hidden;margin:8px 0 4px}
.hp i{display:block;height:100%;background:var(--rd);border-radius:8px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hp.dead{background:color-mix(in srgb,var(--gr) 18%,transparent)}
.hpt{font-size:12px;color:var(--mu);margin:2px 0 0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.badge{padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:center}
.badge .e{font-size:28px;line-height:1.2}
.badge b{display:block;font-size:13px;margin-top:6px}
.badge span{display:block;font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.35}
.badge small{display:block;font-size:10.5px;color:var(--cy);margin-top:6px}
.badge.lock{background:transparent;border-style:dashed}
.badge.lock .e{filter:grayscale(1);opacity:.3}.badge.lock b{color:var(--mu)}
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
@media(max-width:860px){.tiers{grid-template-columns:1fr 1fr}}
.tier{padding:10px;border-radius:12px;border:1px dashed var(--line2);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.tier b{font-size:11.5px;color:var(--mu);font-weight:600}
.tier.un{border-style:solid;border-color:color-mix(in srgb,var(--cy) 45%,transparent)}
.tier em{font-style:normal;color:var(--mu2);font-size:11.5px}
.tier .pill{align-self:flex-start}
.lvlw{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;color:var(--tx);font-family:var(--font);transition:.15s}
.lvlw:hover{border-color:var(--line2)}
.lvlw .g-lv{width:34px;height:34px;box-shadow:none}.lvlw .g-lv span{font-size:14px}
.lvlw b{font-size:13px;display:block;font-weight:600}.lvlw small{font-size:11px;color:var(--mu)}
.lvlw .xpbar{height:4px;margin:4px 0 0}
.xpf{position:fixed;z-index:99;pointer-events:none;font:700 13px var(--font);color:var(--cy);animation:xpf 1.15s ease-out forwards}

 take(/\s~ ?(\d{1,2}) ?h ?(\d{2})?(?=\s)/i,m=>{r.est=(+m[1])*60+(m[2]?+m[2]:0)});
 take(/\s~ ?(\d{1,3}) ?(?:m|min|mn)?(?=\s)/i,m=>{r.est=+m[1]});

 take(/\s(?:le )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/,m=>{const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return;let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;let s=`${y}-${pad(mo)}-${pad(d)}`;if(!m[3]&&s<today())s=`${y+1}-${pad(mo)}-${pad(d)}`;r.due=s});

}
const repeatLabel=r=>!r?'':r.type==='daily'?'Chaque jour':r.type==='weekly'?'Chaque semaine':(r.days.length===5&&[1,2,3,4,5].every(x=>r.days.includes(x)))?'En semaine':[1,2,3,4,5,6,0].filter(x=>r.days.includes(x)).map(x=>DOW[x].replace('.','')).join('·');

function md(src){const lines=esc(src||'').split('\n');let h='',code=false,list=null;
 const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 const close=()=>{if(list){h+=`</${list}>`;list=null}};
 for(const l of lines){
  if(/^```/.test(l)){if(code){h+='</code></pre>';code=false}else{close();h+='<pre><code>';code=true}continue}
  if(code){h+=l+'\n';continue}
  let m;
  if((m=l.match(/^(#{1,3})\s+(.*)/))){close();h+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`;continue}
  if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li class="cb">${m[1].trim()?'☑':'☐'} ${inl(m[2])}</li>`;continue}
  if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inl(m[1])}</li>`;continue}
  if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${inl(m[1])}</li>`;continue}
  if((m=l.match(/^&gt;\s?(.*)/))){close();h+=`<blockquote>${inl(m[1])}</blockquote>`;continue}
  if(!l.trim()){close();continue}
  close();h+=`<p>${inl(l)}</p>`}
 if(code)h+='</code></pre>';close();return h}

 <div class="f-sess">${[0,1,2,3].map(i=>`<i class="${i<ses%4||(ses>0&&ses%4===0)?'on':''}"></i>`).join('')}<span>${ses} session${ses>1?'s':''} · ${fmtMin(lg.f||0)} aujourd'hui</span></div>

function startFocus(){if(F.running)return;F.end=Date.now()+F.remaining*1000;F.running=true;updateFocusUI()}
function pauseFocus(){if(!F.running)return;F.remaining=Math.max(0,Math.round((F.end-Date.now())/1000));F.running=false;updateFocusUI()}

let LASTDAY=today();
function tick(){const td=today(),hm=nowHM(),lead=Number(S.settings.remLead)||0;let ch=false;
 if(td!==LASTDAY){LASTDAY=td;render()}
 for(const t of S.tasks){if(t.status==='done'||!t.due||!t.time)continue;const key=t.due+' '+t.time;if(t.notified===key)continue;
  if(t.due<td){t.notified=key;ch=true}else if(t.due===td&&t.time<=hm){t.notified=key;ch=true;notify(t.title,`Prévu à ${t.time}${t.subtasks&&t.subtasks.length?` · ${t.subtasks.filter(s=>!s.done).length} sous-tâche(s) restante(s)`:''}`,t.id,'task')}
  else if(t.due===td&&lead>0&&t.preNotified!==key){const d=toMin(t.time)-toMin(hm);if(d>0&&d<=lead){t.preNotified=key;ch=true;notify(t.title,`Dans ${d} min · à ${t.time}`,t.id,'pre')}}}
 for(const t of S.tasks){const di=dlInfo(t);if(!di||di.n>1||di.n<0||hm<'09:00')continue;const key=td+'-'+t.deadline;if(t.dlNotified===key)continue;t.dlNotified=key;ch=true;notify(t.title,di.n===0?"À rendre aujourd'hui":'À rendre demain',t.id,'dl')}
 if(ch)commit(['tasks'],true);
 let chm=false;for(const m of S.memos){if(m.done||!m.date||!m.time)continue;const key=m.date+' '+m.time;if(m.notified===key)continue;if(m.date<td){m.notified=key;chm=true}else if(m.date===td&&m.time<=hm){m.notified=key;chm=true;notify(m.text,`Rappel de ${m.time}`,null,'memo',{ref:m.id,rt:'memo'})}
  else if(m.date===td&&lead>0&&m.preNotified!==key){const d=toMin(m.time)-toMin(hm);if(d>0&&d<=lead){m.preNotified=key;chm=true;notify(m.text,`Dans ${d} min · à ${m.time}`,null,'pre',{ref:m.id,rt:'memo'})}}}if(chm)commit(['memos'],true);
 const cl=Number(S.settings.classLead)||0;
 if(cl>0){const nm=toMin(hm);for(const s of classesOn(td)){const a=toMin(s.start),k=td+s.start+s.subject;if(CN.has(k))continue;
  if(nm>=a-cl&&nm<a){CN.add(k);notify(`${isExam(s)?'⚠️ '+kindLabel(s):s.kind} dans ${a-nm} min`,`${sName(s)} · ${sPlace(s)||'salle à confirmer'}`,null,'class')}else if(nm>=a)CN.add(k)}}
 if(!S.meta.onboarded||MODAL||TOUR.i>=0)return;
 const s=S.settings;
 if(S.meta.reviewShown!==td&&hm>=s.reviewTime){S.meta.reviewShown=td;S.meta.briefShown=td;notify('Revue du soir','Deux minutes pour faire le point sur ta journée.',null,'routine',{noToast:true});openReview()}
 else if(S.meta.briefShown!==td&&hm>=s.briefTime&&hm<s.reviewTime){S.meta.briefShown=td;notify('Brief du jour','Ton programme et tes priorités sont prêts.',null,'routine',{noToast:true});openBrief()}}

function GDEF(){return{xp:0,dom:{},badges:{},quests:{date:'',list:[]},weekly:{week:'',kind:'',target:0,done:false},tokens:1,frozen:[],bosses:{},unlocked:{},equip:{},qdone:0,flags:{},seen:{}}}

const gOn=()=>S.settings.game!==false;
const XP_CAP=250;
const lvlCum=L=>25*L*(L-1);
function levelOf(xp){let L=1;while(lvlCum(L+1)<=xp)L++;return L}
const dLvl=xp=>Math.floor(Math.sqrt((xp||0)/15));
const TITLES={space:['Cadet','Pilote','Navigateur','Commandant','Amiral'],cyber:['Recrue','Analyste SOC','Pentester','Red Team Lead','CISO']},TITLE_AT=[1,3,6,10,15];
function titleOf(L){const arr=TITLES[S.settings.gameTheme]||TITLES.space;let i=0;TITLE_AT.forEach((v,k)=>{if(L>=v)i=k});return arr[i]}
const curTitle=L=>S.game.unlocked.title&&S.game.equip.title?'Major de saison':titleOf(L);
function nextTitle(L){const i=TITLE_AT.findIndex(v=>v>L);return i<0?null:{at:TITLE_AT[i],name:(TITLES[S.settings.gameTheme]||TITLES.space)[i]}}
function taskXP(t){const est=t.est||25,base=Math.max(2,Math.round(est/5)),m={1:1,2:1.5,3:2}[t.priority]||1.5,on=t.deadline?(today()<=t.deadline?1.3:1):(!t.due||today()<=t.due?1.2:1);return Math.round(base*m*on)}
function xpFloat(el,g){let x,y;const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;if(r&&r.width){x=r.left+r.width/2;y=r.top}else{const w=$('#lvlW'),wr=w&&w.getBoundingClientRect();if(wr&&wr.width){x=wr.left+wr.width/2;y=wr.top}else{x=innerWidth-90;y=70}}
 const f=document.createElement('div');f.className='xpf';f.textContent=`+${g} XP`;f.style.left=(x-22)+'px';f.style.top=(y-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200)}
function award(n,dom,el){if(!gOn()||!(n>0))return 0;const td=today(),l=S.log[td]=S.log[td]||{};const g=Math.min(n,Math.max(0,XP_CAP-(l.xp||0)));
 if(g<=0){if(S.game.seen.cap!==td){S.game.seen.cap=td;toast('Plafond de '+XP_CAP+' XP atteint pour aujourd\'hui. Tout le reste compte quand même dans tes stats.')}return 0}
 const before=levelOf(S.game.xp);S.game.xp+=g;l.xp=(l.xp||0)+g;if(dom){const d=S.game.dom[dom]=S.game.dom[dom]||{xp:0,last:''};d.xp+=g;d.last=td;l.ax=l.ax||{};l.ax[dom]=(l.ax[dom]||0)+g}
 xpFloat(el,g);const after=levelOf(S.game.xp);if(after>before)setTimeout(()=>levelUp(before,after),700);updateLevelW();return g}
function unaward(n,dom,d){if(!n)return;S.game.xp=Math.max(0,S.game.xp-n);const l=S.log[d||today()];if(l){l.xp=Math.max(0,(l.xp||0)-n);if(dom&&l.ax&&l.ax[dom])l.ax[dom]=Math.max(0,l.ax[dom]-n)}if(dom&&S.game.dom[dom])S.game.dom[dom].xp=Math.max(0,S.game.dom[dom].xp-n);updateLevelW()}
function levelUp(a,b){const nt=curTitle(b),ot=curTitle(a);sound('level');burst($('#lvlW'));
 if(MODAL){toast(`⭐ Niveau ${b} atteint${nt!==ot?` · nouveau titre : <b>${esc(nt)}</b>`:''}`);return}
 openModal('lvl',`<div class="lvlup"><div class="g-lv big"><span>${b}</span></div><h2>Niveau ${b} atteint</h2>${nt!==ot?`<p>Nouveau titre : <b>${esc(nt)}</b></p>`:`<p class="muted">Ton cerveau s'agrandit. Continue comme ça.</p>`}<div class="m-f" style="justify-content:center"><button class="btn" data-act="nav" data-view="stats">Voir ma progression</button><button class="btn primary" data-act="close-modal">Continuer</button></div></div>`)}
function updateLevelW(){const w=$('#lvlW');if(!w)return;if(!gOn()){w.style.display='none';return}w.style.display='';const xp=S.game.xp,L=levelOf(xp),a=lvlCum(L),b=lvlCum(L+1);

async function aiOrganize(text){if(!CAP.sample||!text.trim())return;toast("✨ L'IA organise ton texte…",null,null,2500);
 const td=today(),d=parseYmd(td);
 const prompt=`Tu es l'assistant d'une app d'organisation personnelle (étudiant ingénieur cybersécurité au Maroc, aussi freelance). Transforme le texte libre ci-dessous en éléments structurés.
Aujourd'hui : ${DOWF[d.getDay()]} ${td}. Calcule les dates réelles (YYYY-MM-DD) à partir des expressions relatives.
Types : "task" (action à faire), "memo" (rappel, rendez-vous, info à ne pas oublier), "note" (idée, contenu à garder).
Aspects possibles : savoir (études, apprentissage), carriere (freelance, pro), corps (sport, santé), esprit (bien-être, loisirs), liens (famille, amis), quotidien (maison, courses, admin).
Pour chaque élément : title (court, commence par un verbe pour une tâche), type, date (jour où la faire, ou null), deadline (date limite YYYY-MM-DD si le texte dit « avant », « pour », « d'ici », « à rendre »…, sinon null ; dans ce cas laisse date à null sauf si un jour de travail est précisé), time (HH:MM ou null), priority (1 basse, 2 normale, 3 haute), estimate_min (ou null), aspect, tags (0 à 2 mots), subtasks (0 à 5 étapes seulement si la tâche est grosse), body (pour une note).
Texte : """${text.slice(0,2000)}"""
Réponds uniquement avec ce JSON : {"items":[{"type":"task","title":"...","date":null,"deadline":null,"time":null,"priority":2,"estimate_min":null,"aspect":"savoir","tags":[],"subtasks":[],"body":""}]}`;
 try{const res=await CAP.sample.json(prompt,{modelTier:'quick'});const arr=(res&&res.items)||(Array.isArray(res)?res:[]);
  const items=arr.filter(x=>x&&x.title).slice(0,15).map(x=>({type:['task','memo','note'].includes(x.type)?x.type:'task',title:String(x.title).slice(0,160),date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:null,deadline:/^\d{4}-\d{2}-\d{2}$/.test(x.deadline||'')?x.deadline:null,time:/^\d{2}:\d{2}$/.test(x.time||'')?x.time:null,prio:[1,2,3].includes(+x.priority)?+x.priority:2,est:+x.estimate_min>0?Math.min(600,Math.round(+x.estimate_min)):null,aspect:DOMS[x.aspect]?x.aspect:null,tags:Array.isArray(x.tags)?x.tags.slice(0,3).map(g=>String(g).toLowerCase().replace(/\s+/g,'-')):[],repeat:null,body:String(x.body||''),subtasks:Array.isArray(x.subtasks)?x.subtasks.slice(0,6).map(String):[]}));
  if(!items.length){toast("L'IA n'a rien trouvé à organiser.");return}S.game.flags.ai=1;openCaptureReview(items,'ai')}
 catch(e){const c=e&&e.code;if(c==='not_granted'){CAP.sample=null;document.body.classList.remove('has-ai');toast("L'IA n'est pas disponible ici : l'analyse automatique reste active.")}else if(c==='rate_limited')toast('IA très sollicitée, réessaie dans un instant.');else toast("L'IA n'a pas pu répondre. L'analyse automatique reste disponible.")}}

const WZ_STEPS={task:['type','title','when','prio','aspect','recap'],memo:['type','title','when','aspect','recap'],note:['type','title','aspect','recap']};
function openWizard(preset={}){WZ={i:0,type:'task',title:'',body:'',when:null,date:null,deadline:null,time:'',prio:2,est:null,aspect:null,free:'',...preset};if(preset.type)WZ.i=1;renderWizard();setTimeout(()=>{($('#wzTitle')||$('#wzFree'))?.focus()},60)}
function wzStep(){return WZ_STEPS[WZ.type][WZ.i]}
function renderWizard(){const steps=WZ_STEPS[WZ.type],st=wzStep(),dots=steps.map((s,k)=>`<i class="${k===WZ.i?'on':k<WZ.i?'done':''}"></i>`).join('');let body='',title='';
 if(st==='type'){title='Que veux-tu ajouter ?';body=`<div class="wz-free"><textarea id="wzFree" class="note-in" placeholder="Écris librement ce que tu as en tête, même en vrac : « rdv dentiste jeudi 15h, finir le rapport avant vendredi, idée : app de budget »…">${esc(WZ.free)}</textarea><div class="row"><button class="btn primary" data-act="wz-free">${ic('spark')} Organiser ce texte</button>${CAP.sample?`<button class="btn ghost" data-act="wz-free-ai">✨ Avec l'IA</button>`:''}</div></div><div class="wz-or"><span>ou pas à pas</span></div>
  <div class="wz-opts">${[['task','check','Une tâche','Quelque chose à faire'],['memo','bell','Un rappel','Rendez-vous, chose à ne pas oublier'],['note','note','Une note','Idée, cours, info à garder'],['path','route','Un parcours','Apprendre un sujet, niveau par niveau']].map(([v,i,l,d])=>`<button class="wz-opt ${WZ.type===v?'on':''}" data-act="wz-type" data-val="${v}">${ic(i)}<b>${l}</b><span>${d}</span></button>`).join('')}</div>`}
 else if(st==='title'){title=WZ.type==='memo'?'De quoi veux-tu te souvenir ?':WZ.type==='note'?'Ta note':'Que dois-tu faire ?';
  body=`<div class="wz-in"><input id="wzTitle" class="capt big" value="${esc(WZ.title)}" placeholder="${WZ.type==='memo'?'Ex : RDV dentiste, anniversaire de Sara, code du wifi…':WZ.type==='note'?'Titre de la note':'Ex : Réviser le cours de PKI'}"><button class="icon-btn mic" data-act="mic" data-target="wzTitle" title="Dicter">${ic('mic')}</button></div>${WZ.type==='note'?`<textarea id="wzBody" class="note-in" placeholder="Contenu (Markdown accepté)">${esc(WZ.body)}</textarea>`:'<p class="hint">Astuce : tu peux écrire « demain 18h » directement, Orbit le comprendra.</p>'}`}
 else if(st==='when'){title=WZ.type==='memo'?'Pour quand ?':'Quand vas-tu la faire ?';const ws=wkStart(today());
  const opts=[['today',"Aujourd'hui",today()],['tomorrow','Demain',addDays(today(),1)],['weekend','Ce week-end',addDays(ws,5)],['nextweek','Semaine prochaine',addDays(ws,7)],['pick','Choisir une date',WZ.date||today()],['none','Pas de date',null]];
  body=`<div class="wz-chips">${opts.map(([v,l,d])=>`<button class="wz-chip ${WZ.when===v?'on':''}" data-act="wz-when" data-val="${v}" data-d="${d||''}">${l}${d&&v!=='pick'?`<small>${fmtDate(d)}</small>`:''}</button>`).join('')}</div>${WZ.when==='pick'?`<input type="date" id="wzDate" class="inp" value="${WZ.date||today()}" style="max-width:220px;margin-top:10px">`:''}
  ${WZ.type==='task'?`<label class="wz-lab">Une date limite ? (optionnel)</label><div class="wz-chips">${[['','Aucune',null],...dlDates()].map(([v,l,d])=>`<button class="wz-chip ${(WZ.deadline||null)===d?'on':''}" data-act="wz-dl" data-val="${d||''}">${l}${d&&fmtDate(d)!==l?`<small>${fmtDate(d)}</small>`:''}</button>`).join('')}<input type="date" id="wzDl" class="inp" value="${WZ.deadline||''}" title="Autre date" style="max-width:170px"></div>`:''}
  ${WZ.when!=='none'?`<label class="wz-lab">${WZ.type==='memo'?'À quelle heure ? (optionnel, pour être prévenu)':'À quelle heure ? (optionnel, pour un rappel)'}<input type="time" id="wzTime" class="inp" value="${WZ.time||''}" style="max-width:160px"></label>`:''}`}
 else if(st==='prio'){title="C'est important ?";
  body=`<div class="wz-opts three">${[[1,'Pas urgent','Quand j\'ai le temps'],[2,'Normal','À faire comme prévu'],[3,'Important','À ne surtout pas rater']].map(([v,l,d])=>`<button class="wz-opt p${v} ${WZ.prio===v?'on':''}" data-act="wz-prio" data-val="${v}"><span class="dotp"></span><b>${l}</b><span>${d}</span></button>`).join('')}</div>
  <label class="wz-lab">Combien de temps ça va prendre ?</label><div class="wz-chips">${[[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[0,'Je ne sais pas']].map(([v,l])=>`<button class="wz-chip ${(WZ.est||0)===v?'on':''}" data-act="wz-est" data-val="${v}">${l}</button>`).join('')}</div>`}
 else if(st==='aspect'){title='Quel aspect de ta vie ?';const sug=aspectOfText(WZ.title+' '+WZ.body);
  body=`<div class="wz-opts asp">${Object.entries(DOMS).map(([k,d])=>`<button class="wz-opt ${WZ.aspect===k?'on':''}" style="--ac:${d.c}" data-act="wz-aspect" data-val="${k}"><span class="emo">${d.e}</span><b>${d.n}</b><span>${d.d}</span>${sug===k?'<em>suggéré</em>':''}</button>`).join('')}</div><p class="hint">Sert à équilibrer ton cerveau dans l'onglet Moi.</p>`}
 else if(st==='recap'){title='On ajoute ça ?';const it=wzItem();body=`<div class="wz-recap">${itemLine(it)}</div>`}
 openModal('wizard',`<div class="wz-top"><span class="eyebrow">Ajout guidé</span><div class="tdots">${dots}</div><button class="icon-btn" data-act="close-modal" title="Fermer">${ic('x')}</button></div><h2>${title}</h2>${body}

function wzItem(){return{type:WZ.type,title:WZ.title.trim(),body:WZ.body,date:WZ.when==='none'?null:WZ.date,deadline:WZ.type==='task'?(WZ.deadline||null):null,time:WZ.when==='none'?null:(WZ.time||null),prio:WZ.prio,est:WZ.est||null,aspect:WZ.aspect||aspectOfText(WZ.title),tags:[],repeat:null,subtasks:[]}}
function wzNext(){const st=wzStep();
 if(st==='title'){const v=($('#wzTitle')?.value||'').trim();if(!v){$('#wzTitle')?.focus();toast('Écris au moins quelques mots.');return}
  if(WZ.type!=='note'){const p=parseOne(v);WZ.title=p.title||v;if(p.deadline&&!WZ.deadline)WZ.deadline=p.deadline;if(p.date&&!WZ.when){WZ.when='pick';WZ.date=p.date}if(p.time)WZ.time=p.time;if(p.prio!==2)WZ.prio=p.prio;if(p.est)WZ.est=p.est}else WZ.title=v;

 if(st==='when'){if(!WZ.when){WZ.when=WZ.type==='memo'?'none':'today';WZ.date=WZ.when==='today'?today():null}const dt=$('#wzDate');if(dt&&WZ.when==='pick')WZ.date=dt.value||today();const dl=$('#wzDl');if(dl)WZ.deadline=dl.value||null;WZ.time=$('#wzTime')?.value||''}

const findM=id=>S.memos.find(m=>m.id===id);
function addMemo(o,quiet){const m={id:uid(),text:'',date:null,time:null,tags:[],aspect:null,pinned:false,done:false,createdAt:Date.now(),notified:'',...o};if(!m.aspect)m.aspect=aspectOfText(m.text);S.memos.unshift(m);logInc(today(),'mm',1);if(!quiet)commit(['memos','meta']);return m}
function memoHTML(m){const td=today(),late=m.date&&m.date<td&&!m.done;
 return `<div class="memo ${m.done?'done':''} ${m.pinned?'pin':''}" data-mid="${m.id}"><span class="memo-ic ${m.date===td&&!m.done?'hot':''}">${ic(m.date?(m.time?'bell':'cal'):(m.pinned?'pin':'bookmark'))}</span><div class="memo-b" data-act="memo-edit"><span class="memo-t">${esc(m.text)}</span><span class="memo-m">${m.date?`<span class="chip ${late?'late':m.date===td?'today':''}">${fmtDate(m.date)}${m.time?' · '+m.time:''}</span>`:''}${aspChip(m.aspect)}${(m.tags||[]).map(g=>`<span class="chip tag" style="--h:${hue(g)}">#${esc(g)}</span>`).join('')}</span></div><button class="icon-btn sm ${m.pinned?'on':''}" data-act="memo-pin" title="${m.pinned?'Désépingler':'Épingler'}">${ic('pin')}</button><button class="icon-btn sm" data-act="memo-done" title="${m.done?'Restaurer':'Archiver'}">${ic(m.done?'reset':'check')}</button></div>`}
const memoForm=(id,ph)=>`<form class="quick memo-q" id="${id}" autocomplete="off">${ic('bell')}<input name="m" placeholder="${esc(ph)}"><button class="btn primary sm" type="submit">Retenir</button></form>`;

 const todayL=act.filter(m=>m.date===td).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1),soon=act.filter(m=>m.date&&m.date>td).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1),past=act.filter(m=>m.date&&m.date<td),pins=act.filter(m=>!m.date&&m.pinned),free=act.filter(m=>!m.date&&!m.pinned),arch=S.memos.filter(m=>m.done).slice(0,40);
 let h=memoForm('memoQuick',"Se rappeler de… ex : RDV dentiste jeudi 15h, code du wifi : 4521, anniversaire de Sara le 12/12");
 if(!S.memos.length)return h+`<div class="empty"><div class="big">🔔</div><h3>Rien à retenir pour l'instant</h3><p>Note ici tes rendez-vous, les choses à ne pas oublier, les infos utiles. Tu pourras tout retrouver avec la recherche.</p></div>`;
 const grp=(t,l,extra='')=>l.length?`<div class="sec">${secH(t,l.length,'',extra)}<div class="memos">${l.map(memoHTML).join('')}</div></div>`:'';
 h+=grp("Aujourd'hui",todayL)+grp('À venir',soon)+grp('Épinglés',pins)+grp('À garder en tête',free)+grp('Passés',past,`<button class="link" data-act="memo-archive-past">Tout archiver</button>`);
